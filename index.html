function limitHaulHTML(p, r = calc(p), compact = false){
  if (p.mode === "random") return "";
  if (!(r.lim > 0)) return `<div class="lh"><b>ซื้อได้ไม่จำกัด</b> · ใส่ Limit เพื่อดูยอดเมื่อซื้อครบ</div>`;
  const merged = new Map();
  p.items.forEach(x => { const k = itemKey(x), o = merged.get(k) || { x, pcs:0 }; o.pcs += n(x.amt); merged.set(k, o); });
  const rows = mult => [...merged.values()].map(o => `<li><span>${esc(o.x.name || "(ไม่มีชื่อ)")}</span><b>× ${fmt(o.pcs * mult, 0)}</b></li>`).join("")
    + (r.bonus ? `<li class="bn"><span>Golden Seed Point</span><b>× ${fmt(r.gsp * mult, 0)}</b></li><li class="bn"><span>Player EXP</span><b>× ${fmt(r.exp * mult, 0)}</b></li>` : "");
  const many = r.rounds && r.rounds > 1;
  return `<div class="lh"><div class="lh-h">ซื้อครบ Limit ${fmt(r.lim,0)} ครั้ง${many ? " ต่อรอบ" : ""}: จ่าย <b>฿${fmt(r.limPay)}</b></div><ul>${rows(r.lim)}</ul>
    ${many ? `<div class="lh-h">ตลอดโปร ${fmt(r.rounds,0)} รอบ (${fmt(r.lim * r.rounds,0)} ครั้ง): จ่าย <b>฿${fmt(r.limPayAll)}</b></div>${compact ? "" : `<ul>${rows(r.lim * r.rounds)}</ul>`}` : ""}
    ${r.rounds === null ? `<div class="lh-n">ใส่วันจบการขายเพื่อนับจำนวนรอบ Reset</div>` : ""}</div>`;
}
/* Random pack: simulate many players who each buy the whole Limit once (one round); report P25 / P50 / P75 */
const LDIST = new Map();
function limitDist(p){
  const r = calc(p), pulls = r.lim > 0 ? r.lim : 10, key = simKey(p) + "|" + pulls;
  if (LDIST.has(key)) return LDIST.get(key);
  const pool = p.items.map((x, i) => ({ x, i })).filter(o => !o.x.fixed && n(o.x.chance) > 0);
  const W = pool.reduce((a, o) => a + n(o.x.chance), 0);
  if (!pool.length || !(W > 0)) return null;
  const cum = []; let acc = 0; pool.forEach(o => { acc += n(o.x.chance) / W; cum.push(acc); });
  let seed = [...key].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) || 1;     // fixed seed: the numbers stay put between redraws
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const keys = [...new Set(p.items.map(itemKey))], kix = new Map(keys.map((k, i) => [k, i]));
  const N = 2000, pcs = keys.map(() => new Float64Array(N)), val = new Float64Array(N);
  const fixedVal = r.fixedTHB * pulls;
  for (let pl = 0; pl < N; pl++) {
    let v = fixedVal;
    p.items.forEach(x => { if (x.fixed) pcs[kix.get(itemKey(x))][pl] += n(x.amt) * pulls; });
    for (let d = 0; d < pulls; d++) { const u = rnd(); let lo = 0, hi = cum.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (u <= cum[m]) hi = m; else lo = m + 1; }
      const o = pool[lo]; pcs[kix.get(itemKey(o.x))][pl] += n(o.x.amt); v += r.rows[o.i].thb; }
    val[pl] = v;
  }
  const q = (arr, f) => { const a = Float64Array.from(arr).sort(); return a[Math.min(a.length - 1, Math.floor(f * (a.length - 1)))]; };
  const items = keys.map((k, i) => { const x = p.items.find(y => itemKey(y) === k);
    return { x, fixed: p.items.filter(y => itemKey(y) === k).every(y => y.fixed), p25:q(pcs[i], .25), p50:q(pcs[i], .5), p75:q(pcs[i], .75), mean: pcs[i].reduce((a, b) => a + b, 0) / N }; })
    .sort((a, b) => (b.fixed - a.fixed) || (b.mean - a.mean));
  const out = { pulls, limited: r.lim > 0, pay: r.price * pulls, items, v25:q(val, .25), v50:q(val, .5), v75:q(val, .75), N };
  if (LDIST.size > 50) LDIST.clear(); LDIST.set(key, out); return out;
}
function limitDistHTML(p){
  const d = limitDist(p); if (!d) return `<div class="lh-n">ใส่ % โอกาสของสุ่มก่อน แล้วสรุปจะขึ้นที่นี่</div>`;

/* ---------- gacha simulation (Random packs) ---------- */
const SIM = { players:100, pulls:10, preset:"10", res:null, sort:"value-desc", show:50, open:{} };
const SIM_MAX_DRAWS = 3000000;
const simKey = p => JSON.stringify([p.id, p.price, S.settings.rate, p.items.map(x => [x.itemId, x.name, x.amt, x.tp, x.chance, !!x.fixed])]);

function runSim(){
  const p = active(), r = calc(p), N = Math.floor(SIM.players), M = Math.floor(SIM.pulls);
  if (!(N >= 1) || !(M >= 1)) { toast("ใส่จำนวนผู้เล่นและจำนวนครั้งอย่างน้อย 1"); return; }
  if (N * M > SIM_MAX_DRAWS) { toast(`จำนวนสุ่มรวม ${fmt(N*M,0)} ครั้ง มากเกินไป (สูงสุด ${fmt(SIM_MAX_DRAWS,0)})`); return; }
  const L = p.items.length;
  const pool = [], cum = []; let W = 0;
  p.items.forEach((x,i) => { if (!x.fixed && n(x.chance) > 0) { W += n(x.chance); pool.push(i); cum.push(W); } });
  const fixedIdx = p.items.map((x,i) => x.fixed ? i : -1).filter(i => i >= 0);
  if (!pool.length && !fixedIdx.length) { toast("ยังไม่มีไอเทมที่มี % โอกาส"); return; }
  const unitTHB = r.rows.map(c => c.thb);                     // value of one draw of item i (amount × TP × rate)
  const amt = p.items.map(x => n(x.amt));
  const draws = new Float64Array(L), owners = new Uint32Array(L);
  const players = new Array(N), counts = new Uint32Array(L);
  for (let k = 0; k < N; k++) {
    counts.fill(0);
    for (let m = 0; m < M; m++) {
      if (!pool.length) break;
      const u = Math.random() * W; let lo = 0, hi = cum.length - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (u < cum[mid]) hi = mid; else lo = mid + 1; }
      counts[pool[lo]]++;
    }
    fixedIdx.forEach(i => counts[i] += M);
    let value = 0; const got = [];
    for (let i = 0; i < L; i++) if (counts[i]) { value += counts[i] * unitTHB[i]; got.push([i, counts[i]]); draws[i] += counts[i]; owners[i]++; }
    got.sort((a,b) => b[1]*unitTHB[b[0]] - a[1]*unitTHB[a[0]]);
    players[k] = { no:k+1, got, value, spend:M * r.price };
  }
  const values = players.map(x => x.value).sort((a,b) => a - b);
  const spend = N * M * r.price, total = values.reduce((a,v) => a + v, 0);
  const ret = v => r.price > 0 ? v / (M * r.price) : NaN;
  const buckets = [[0,.5,"ต่ำกว่า 50%"],[.5,1,"50–99%"],[1,2,"100–199%"],[2,Infinity,"200% ขึ้นไป"]]
    .map(([a,b,l]) => ({ l, c: values.filter(v => { const q = ret(v); return q >= a && q < b; }).length }));
  SIM.res = { key:simKey(p), N, M, price:r.price, players, draws:[...draws], owners:[...owners], unitTHB, amt, spend, total,
    min:values[0], max:values[N-1], median: N % 2 ? values[(N-1)/2] : (values[N/2-1] + values[N/2]) / 2,
    winners: players.filter(x => x.value >= x.spend).length, buckets, W, poolCount:pool.length,
    theory: r.price > 0 ? (r.ev * (W ? 100 / W : 1) + r.fixedTHB) / r.price : NaN, top: r.top ? p.items.indexOf(r.top.x) : -1 };
  SIM.show = 50; renderSim();
}

// plain-language "was it worth it": baht difference, plus "x เท่า" only when it is clearly more than double
function verdictLine(value, pay, short = false){
  if (!(pay > 0)) return "";
  const d = Math.round(value - pay), x = value / pay;
  if (d >= 0) return (short ? "ได้ของเกินที่จ่าย " : "ได้ของมากกว่าเงินที่จ่าย ") + `<b>฿${fmt(d)}</b>` + (x >= 2 ? ` (คุ้ม ${fmt(x,1)} เท่า)` : "");
  return (short ? "ได้ของน้อยกว่าที่จ่าย " : "ได้ของน้อยกว่าเงินที่จ่าย ") + `<b>฿${fmt(-d)}</b>`;
}

function copySim(){

  const lines = [hdr.join("\t")].concat(R.players.map(pl => [pl.no, pl.spend, +pl.value.toFixed(2), +(pl.value - pl.spend).toFixed(2),

/* ---------- home: dashboard of promotion folders ---------- */
const HV = { q:"", period:"all", from:"", to:"", sort:"start", menu:null, armed:null, rename:null };
const FOLDER_COLORS = ["#c9861a","#3b7dd8","#1f8a5b","#8a55d1","#c2459b","#0f9e9e","#d4572a","#5a6fd6"];
const folderColor = f => f.color || FOLDER_COLORS[[...f.id].reduce((a,c) => a + c.charCodeAt(0), 0) % FOLDER_COLORS.length];
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
function packRange(p){ const a = toDT(p.start, p.startTime), b = toDT(p.end, p.endTime); return a || b ? [a || b, b || a] : null; }
function folderRange(f){
  let lo = null, hi = null;
  f.packs.forEach(p => { const r = packRange(p); if (!r) return; if (!lo || r[0] < lo) lo = r[0]; if (!hi || r[1] > hi) hi = r[1]; });
  return lo ? [lo, hi] : null;
}
function periodWindow(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  switch (HV.period) {
    case "now": return [now, now];
    case "month": return [new Date(y, m, 1), new Date(y, m + 1, 0, 23, 59, 59)];
    case "next": return [new Date(y, m + 1, 1), new Date(y, m + 2, 0, 23, 59, 59)];
    case "custom": { const a = HV.from ? new Date(HV.from + "T00:00") : null, b = HV.to ? new Date(HV.to + "T23:59:59") : null; return a || b ? [a || new Date(0), b || new Date(8.64e15)] : null; }
    default: return null;
  }
}
const overlaps = (r, w) => !w || (r && r[0] <= w[1] && r[1] >= w[0]);
function folderStatus(f){
  const r = folderRange(f), now = new Date();
  if (!r) return { k:"draft", t:"ยังไม่กำหนดวัน" };
  if (now < r[0]) { const d = Math.ceil((dayStart(r[0]) - dayStart(now)) / 864e5); return { k:"soon", t: d <= 0 ? "เริ่มวันนี้" : `อีก ${d} วันเริ่มขาย` }; }
  if (now > r[1]) return { k:"done", t:"จบการขายแล้ว" };
  return { k:"live", t:"กำลังขาย" };
}
const fmtD = d => d.toLocaleDateString("th-TH", { day:"numeric", month:"short", year:"2-digit" });
const rangeText = r => r ? `${fmtD(r[0])} – ${fmtD(r[1])}` : "ยังไม่กำหนดช่วงขาย";

/* Fill Rate: random items that already have a rate keep it; the rest share what is left of 100% equally */
function fillRate(p){
  const pool = p.items.filter(x => !x.fixed);
  const set = pool.filter(x => n(x.chance) > 0), empty = pool.filter(x => !(n(x.chance) > 0));
  if (!pool.length) { toast("ยังไม่มีไอเทมสุ่ม"); return; }
  if (!empty.length) { toast("ไอเทมสุ่มทุกชิ้นมีเรทแล้ว ลบเรทของชิ้นที่อยากให้ระบบเกลี่ยก่อน"); return; }
  const used = set.reduce((a,x) => a + n(x.chance), 0), left = Math.round((100 - used) * 1e4) / 1e4;
  if (left <= 0) { toast(`ชิ้นที่ใส่เรทแล้วรวม ${fmt(used,4)}% ไม่เหลือเรทให้แบ่ง`); return; }
  const each = Math.floor(left / empty.length * 1e4) / 1e4;
  empty.forEach((x, i) => x.chance = i < empty.length - 1 ? each : Math.round((left - each * (empty.length - 1)) * 1e4) / 1e4);
  save(); renderEditor(); renderRight();
  toast(`แบ่ง ${fmt(left,4)}% ให้ ${empty.length} ชิ้น · ชิ้นละ ${fmt(each,4)}%`);
}

  const p = active(), sec = e.target.closest("tr.sec"), tr = e.target.closest("#tbody tr[data-row]");

    addItem(it, p, p.mode === "random" && toFixed); return; }
  if (dragRow == null) return;

  else if (tr) { const to = +tr.dataset.row; if (to === dragRow) return; const target = p.items[to];
    p.items.splice(dragRow, 1); p.items.splice(p.items.indexOf(target) + (to > dragRow ? 1 : 0), 0, m);

/* copy rows for Google Sheet */
async function copyTSV(p){
  const r = calc(p), rnd = p.mode==="random";
  const hdr = rnd ? ["Item ID","Item Name","Amt","Chance","Tradable","TP / ea","Sum TP","THB","EV"] : ["Item ID","Item Name","Amt","Tradable","TP / ea game","TP Web shop","Realistic Price","THB"];
  const lines = [hdr.join("\t")].concat(p.items.map((x,i) => { const c = r.rows[i], m = BYID.get(x.itemId), tr = m?.trade==="TRUE" ? "O" : "X";
    return (rnd ? [x.itemId, x.name, n(x.amt), x.fixed ? "Fixed" : n(x.chance), tr, n(x.tp), c.sumTP, c.thb, x.fixed ? "-" : +c.ev.toFixed(4)]
                : [x.itemId, x.name, n(x.amt), tr, c.game, n(x.tp), c.sumTP, c.thb]).join("\t"); }));
  const text = lines.join("\n");
  try { await navigator.clipboard.writeText(text); toast("คัดลอกแล้ว วางใน Google Sheet ได้เลย"); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); toast("คัดลอกแล้ว"); } catch { toast("คัดลอกไม่ได้"); } ta.remove(); }
}

/* add folders from a saved .json (also used to move this browser's old data into the database) */

/* ---------- Aztek bundle export (.xlsx) — matches "bundle-import.xlsx" ---------- */
const XL_SHEET = "Import Bundle_Final Cleaning";
const XL_HEAD = ["Bundle Name","Bundle Type","Item Type","Item ID","Quantity","Tier","Position","เรทสุ่ม","เรทโชว์"];
const GSP_ID = "Golden Seed Point", EXP_ID = "Player Experience - tosm";
/* one item row; returns {row} or {error} */
function xlItemRow(x){
  const cur = currencyOf(x);
  if (cur) return { type:"WALLET_DEBIT", id:cur.exp, tier:"Trainee" };
  const id = String(x.itemId || "").trim();
  if (!id) return { error:`“${x.name || "ไอเทมไม่มีชื่อ"}” ไม่มี Item ID` };
  const m = BYID.get(id);
  if (!/^\d+$/.test(id)) return { error:`“${x.name}” มี Item ID “${id}” ซึ่งไม่ใช่ตัวเลข` };
  return { type:"ITEM", id:Number(id), tier:(m?.grade || "").trim() || "Trainee", warn: !m && ITEMS.length ? `“${x.name}” (${id}) ไม่พบใน Sheet ไอเทม · ใช้ Tier = Trainee` : null };
}
/* pack → bundles. FIXED pack: 1 bundle (items + GSP + EXP). RANDOM pack: "name" FIXED (sure items + GSP + EXP) + "name - Random" RANDOM. */
function xlPack(p){
  const errors = [], warns = [], name = String(p.name || "").trim(), price = n(p.price), seed = n(S.settings.seed) || 10;
  if (!name) errors.push("ยังไม่มีชื่อแพ็ก");
  if (!(price > 0)) errors.push("ยังไม่ได้ใส่ราคา (ต้องใช้คำนวณ GSP / EXP)");
  const rnd = p.mode === "random";
  const sure = p.items.filter(x => !rnd || x.fixed), pool = rnd ? p.items.filter(x => !x.fixed) : [];
  const mk = (bundle, type, list, isRand) => {
    const rows = [];
    list.forEach(x => { const r = xlItemRow(x); if (r.error) { errors.push(r.error); return; } if (r.warn) warns.push(r.warn);
      const q = n(x.amt); if (!(q > 0)) errors.push(`“${x.name}” จำนวนต้องมากกว่า 0`);
      const ch = isRand ? n(x.chance) : "";
      rows.push([bundle, type, r.type, r.id, q, r.tier, 0, ch, ch]); });
    return rows;
  };
  const fixedRows = mk(name, "FIXED", sure, false);
  if (p.bonus !== false) {                                   // the pack gives Golden Seed Point + Player EXP
    fixedRows.push([name, "FIXED", "WALLET_DEBIT", GSP_ID, price * seed, "Trainee", 0, "", ""]);
    fixedRows.push([name, "FIXED", "PLAYER_EXPERIENCE", EXP_ID, price, "Trainee", 0, "", ""]);
  }
  /* a Random pack with no guaranteed items and no GSP / EXP has nothing for its FIXED bundle: only the RANDOM one is made */
  const bundles = fixedRows.length || !rnd ? [{ name, type:"FIXED", rows:fixedRows }] : [];
  if (rnd) {
    if (!pool.length) errors.push("แพ็กสุ่มยังไม่มีของสุ่ม");
    const rn = name + " - Random", rr = mk(rn, "RANDOM", pool, true);
    const sum = pool.reduce((a,x) => a + n(x.chance), 0);
    if (pool.length && Math.abs(sum - 100) > 0.0001) errors.push(`เรทของสุ่มรวม ${fmt(sum,4)}% (ต้องเท่ากับ 100%)`);
    if (pool.some(x => !(n(x.chance) > 0))) errors.push("มีของสุ่มที่ยังไม่ได้ใส่เรท");
    bundles.push({ name:rn, type:"RANDOM", rows:rr });
  }
  bundles.forEach(b => b.rows.forEach((r, i) => r[6] = i + 1));           // Position = order inside the bundle
  if (!sure.length && !rnd) (p.bonus !== false ? warns : errors).push(p.bonus !== false ? "แพ็กนี้ไม่มีไอเทม จะมีแค่ GSP + EXP" : "Bundle ว่าง: ไม่มีไอเทม และตั้งไว้ว่าไม่ได้ GSP / EXP");
  return { p, bundles, errors:[...new Set(errors)], warns:[...new Set(warns)] };
}

function xlProduct(p){

  if (rs.on && !rs.firstDate) errors.push("เลือก Reset แต่ยังไม่ได้ใส่วัน Reset ครั้งแรก");

    "TRUE", "TRUE", "FALSE", "Seed Point", sp, sp, "", "", "", "", "", "",
    ...(p.mode === "random" && !p.items.some(x => x.fixed) && p.bonus === false ? [name + " - Random", ""] : [name, p.mode === "random" ? name + " - Random" : ""])];
  return { p, row, errors:[...new Set(errors)] };

    xlDownload(X, XL_SHEET, XL_HEAD, rows, [{wch:34},{wch:12},{wch:20},{wch:26},{wch:10},{wch:12},{wch:9},{wch:10},{wch:10}], f.name + " - Bundle Import.xlsx");
    out.push(`${chosen.reduce((a,r) => a + r.b.bundles.length, 0)} Bundle`); }

    out.push(`${chosen.length} Product`); }

document.addEventListener("click", e => {

  if (e.target === ov || e.target.id === "xl-cancel") { ov.hidden = true; return; }
  if (e.target.id === "xl-go") return doExport();
  const f = S.folders.find(x => x.id === XV.fid);
  const mb = e.target.closest("[data-xlmode]"); if (mb) { XV.mode = mb.dataset.xlmode; openExport(XV.fid); return; }

/* ---------- สรุปไอเทม: what was put on sale, and what actually sold, per promotion / week / month ----------
   "offer"  = pieces in one purchase (random items = amount × chance share)
   "max"    = offer × Limit × Reset rounds (most one ID can get)
   "sold"   = offer × the pack's real sold count (p.sold, typed in after the promotion; later from Grafana)
   week/month columns: offer & max count in full in every period the pack is on sale; sold is split by days on sale */
const IV = { mode:"promo", metric:"offer", range:"all", from:"", to:"", q:"", type:"", grade:"", folder:"", cat:"", btype:"", open:new Set(), pick:{}, soldPanel:false, sort:"total" };
const DAY = 864e5;
const dOnly = s => { if (!s) return null; const d = new Date(s + "T00:00"); return isNaN(d) ? null : d; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const thShort = d => d.toLocaleDateString("th-TH", { day:"numeric", month:"short" });

const spanDays = ([a, b]) => Math.round((b - a) / DAY) + 1;
function overlapDays(sp, [pa, pb]){ const a = Math.max(sp[0], pa), b = Math.min(sp[1], pb); return b >= a ? Math.round((b - a) / DAY) + 1 : 0; }

function perBuy(p){

  p.items.forEach(x => { const k = itemKey(x), share = !rnd || x.fixed ? 1 : W > 0 ? n(x.chance) / W : 0;
    const e = m.get(k) || { x, pcs:0, rand:false, ch:0 }; e.pcs += n(x.amt) * share; if (rnd && !x.fixed) { e.rand = true; e.ch += n(x.chance); } m.set(k, e); });
  return m;
}
function packMult(p, metric){

  const lim = n(p.limit); if (!(lim > 0)) return Infinity;

function itemsRange(){
  const all = S.folders.flatMap(f => f.packs).map(packSpan).filter(Boolean);

  if (IV.range === "month") return [new Date(now.getFullYear(), now.getMonth(), 1), new Date(now.getFullYear(), now.getMonth() + 1, 0)];
  if (IV.range === "3m") return [new Date(now.getFullYear(), now.getMonth() - 2, 1), new Date(now.getFullYear(), now.getMonth() + 1, 0)];
  if (IV.range === "custom" && dOnly(IV.from) && dOnly(IV.to)) return [dOnly(IV.from), dOnly(IV.to)];

  return [new Date(Math.min(...all.map(s => +s[0]))), new Date(Math.max(...all.map(s => +s[1])))];

function itemPeriods(range){

  if (IV.mode === "week") {
    const d = new Date(range[0]); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));        // back to Monday
    while (d <= range[1] && out.length < 60) { const a = new Date(d), b = new Date(d); b.setDate(b.getDate() + 6);
      out.push({ key:ymd(a), label:`${thShort(a)} – ${thShort(b)}`, span:[a, b] }); d.setDate(d.getDate() + 7); }

/* rows: one per item; cols: folders (promo) or periods (week / month) */
function itemsData(){
  const range = itemsRange(), metric = IV.metric;
  const folders = S.folders.filter(f => !IV.folder || f.id === IV.folder);
  const entries = [];                                  // every (folder, pack) that counts
  folders.forEach(f => f.packs.forEach(p => { const sp = packSpan(p);
    if (range && IV.range !== "all" && (!sp || !overlapDays(sp, range))) return;
    if (IV.cat && catOf(p) !== IV.cat) return;
    if (IV.btype && p.mode !== IV.btype) return;
    entries.push({ f, p, sp, buy:perBuy(p), mult:packMult(p, metric) }); }));
  const cols = IV.mode === "promo" ? folders.filter(f => entries.some(e => e.f === f)).map(f => ({ key:f.id, label:f.name, f }))
    : itemPeriods(range);
  const rows = new Map(); let undated = 0;
  entries.forEach(e => {
    if (IV.mode !== "promo" && !e.sp) { undated++; return; }
    e.buy.forEach((b, k) => {
      const m = BYID.get(b.x.itemId);
      if (IV.type && m?.type !== IV.type) return; if (IV.grade && m?.grade !== IV.grade) return;
      if (IV.q) { const q = IV.q.toLowerCase(); if (![b.x.name, m?.th, b.x.itemId].some(v => String(v || "").toLowerCase().includes(q))) return; }
      const r = rows.get(k) || { k, x:b.x, m, cells:new Map(), total:0, inf:false, none:true, packs:[], rand:false, first:null, last:null };
      const mult = e.mult;

/* ---------- shared-data helpers (used by the Apps Script and the database modes) ---------- */
/* apply rows from the server; skip rows this page changed and has not pushed yet (ours will win when pushed) */
function applyRows(rows, initial, last, snapshot, force){
  const seen = []; seen.changed = 0;
  if (!rows.length) return seen;
  const cur = initial ? null : snapshot(), touched = new Set();
  const pending = k => cur.has(k) ? cur.get(k).json !== last.get(k) : last.has(k);   // changed or deleted here, not pushed yet
  const order = { shared:0, memo:0, folder:1, pack:2 };
  rows.slice().sort((a, b) => order[a.kind] - order[b.kind]).forEach(r => {
    const k = r.kind + ":" + r.id;
    if (!initial && pending(k) && !(force && force(k))) return;
    if (r.deleted ? !last.has(k) && !initial : last.get(k) === r.json) return;   // nothing new (e.g. our own write coming back)
    seen.changed++;
    if (r.kind === "shared" && !r.deleted) {
      const d = JSON.parse(r.json);
      S.customCats = d.customCats || []; S.azMap = d.azMap || {}; if ("memo" in d) S.memo = d.memo || {};
      if (d.settings) { S.settings.rate = d.settings.rate; S.settings.seed = d.settings.seed; }
    }
    if (r.kind === "memo") { if (r.deleted) delete S.memo[r.id]; else S.memo[r.id] = JSON.parse(r.json); }
    if (r.kind === "folder") {
      const i = S.folders.findIndex(f => f.id === r.id);
      if (r.deleted) { if (i >= 0) { seen.push({ by:r.by, what:`ลบโฟลเดอร์ “${S.folders[i].name}”` }); S.folders.splice(i, 1); } }
      else { const d = JSON.parse(r.json); let f = S.folders[i];
        if (!f) { f = newFolder({ id:r.id, packs:[] }); S.folders.push(f); }
        Object.assign(f, { name:d.name, color:d.color, created:d.created, updated:r.updated, _order:d.order || [] }); touched.add(f); }
    }
    if (r.kind === "pack") {
      let at = null; S.folders.forEach(f => { const i = f.packs.findIndex(p => p.id === r.id); if (i >= 0) at = { f, i }; });
      if (r.deleted) { if (at) { at.f.packs.splice(at.i, 1); touched.add(at.f); } }
      else { const d = JSON.parse(r.json);
        let f = S.folders.find(x => x.id === r.fid);
        if (!f) { f = newFolder({ id:r.fid, packs:[] }); S.folders.push(f); }
        if (at && at.f !== f) { at.f.packs.splice(at.i, 1); touched.add(at.f); at = null; }
        if (at) f.packs[at.i] = d; else f.packs.push(d);
        f.updated = Math.max(f.updated || 0, r.updated); touched.add(f);
        if (!initial && f.id === S.folderId) seen.push({ by:r.by, what:`แก้ “${d.name}”` }); }
    }
    r.deleted ? last.delete(k) : last.set(k, r.json);
  });
  touched.forEach(f => { const o = f._order || []; if (o.length) f.packs.sort((a, b) => (o.indexOf(a.id) + 1 || 1e9) - (o.indexOf(b.id) + 1 || 1e9)); });
  S.folders.sort((a, b) => (a.created || 0) - (b.created || 0));
  return seen;
}

/* ---------- shared data (runs only inside the Apps Script web app) ----------
   Every folder, pack and the shared settings are one row each on the server.
   Local edits are diffed against what was last synced and pushed (debounced);
   other people's edits are pulled every few seconds. Same row edited by two people = last save wins. */
function makeCloud(){
  const run = google.script.run;
  const call = (fn, ...a) => new Promise((ok, bad) => run.withSuccessHandler(ok).withFailureHandler(bad)[fn](...a));
  const LS_ME = "tosm-pack-builder:me";
  const last = new Map();               // key → json as last synced
  let since = 0, timer = null, pushing = false, again = false, pollT = null, ready = false, lastOk = null, errMsg = "";
  const me = () => lsGet(LS_ME) || "";
  const clean = o => JSON.stringify(o, (k, v) => k.startsWith("_") ? undefined : v);
  function snapshot(){
    const m = new Map();
    S.folders.forEach(f => {
      m.set("folder:" + f.id, { kind:"folder", id:f.id, fid:"", json: clean({ name:f.name, color:f.color || "", created:f.created || 0, order:f.packs.map(p => p.id) }) });
      f.packs.forEach(p => m.set("pack:" + p.id, { kind:"pack", id:p.id, fid:f.id, json: clean(p) }));
    });
    m.set("shared:main", { kind:"shared", id:"main", fid:"", json: clean({ customCats:S.customCats, azMap:S.azMap, memo:S.memo, settings:{ rate:S.settings.rate, seed:S.settings.seed } }) });
    return m;
  }
  function badge(){
    const b = $("#cloud"); b.hidden = false;
    b.classList.toggle("err", !!errMsg); b.classList.toggle("busy", pushing);
    b.textContent = errMsg ? "⚠ ยังไม่ได้บันทึก" : pushing || timer ? "⟳ กำลังบันทึก…" : `☁ ข้อมูลร่วม${lastOk ? " · " + hhmm(lastOk) : ""}`;
    b.title = errMsg ? errMsg + " · จะลองใหม่อัตโนมัติ" : `ทุกคนที่เปิดลิงก์นี้เห็นและแก้ข้อมูลเดียวกัน${me() ? " · คุณใช้ชื่อ " + me() : " · กดเพื่อตั้งชื่อของคุณ"}`;
  }
  function schedule(){ if (!ready) return; clearTimeout(timer); timer = setTimeout(push, 800); badge(); }
  async function push(){
    timer = null;
    if (pushing) { again = true; return; }
    const cur = snapshot(), rows = [];
    cur.forEach((r, k) => { if (last.get(k) !== r.json) rows.push(r); });
    last.forEach((_, k) => { if (!cur.has(k)) { const [kind, ...id] = k.split(":"); rows.push({ kind, id:id.join(":"), fid:"", json:null }); } });
    if (!rows.length) { badge(); return; }
    pushing = true; badge();
    try {
      await call("api_save", { by: me() || "ไม่ระบุชื่อ", rows });
      rows.forEach(r => { const k = r.kind + ":" + r.id; r.json == null ? last.delete(k) : last.set(k, r.json); });
      errMsg = ""; lastOk = new Date();
    } catch (e) { errMsg = "บันทึกขึ้นระบบไม่สำเร็จ: " + (e?.message || e); setTimeout(schedule, 5000); }
    pushing = false; badge();
    if (again) { again = false; schedule(); }
  }
  const apply = (rows, initial) => applyRows(rows, initial, last, snapshot);
  async function poll(){
    clearTimeout(pollT);
    try {
      const r = await call("api_changes", since);
      const seen = apply(r.rows || [], false); since = Math.max(since, r.rev || 0);
      if (seen.length) { refresh(); const who = [...new Set(seen.map(x => x.by || "ผู้ใช้อื่น"))].join(", ");
        toast(seen.length === 1 ? `${who} ${seen[0].what}` : `${who} แก้ไข ${seen.length} รายการ`); }
      else if (seen.changed) refresh();
    } catch {}

  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && ready) poll(); });
  async function start(){
    const ov = document.createElement("div"); ov.className = "cl-load"; ov.textContent = "กำลังโหลดข้อมูลร่วม…"; document.body.append(ov);
    try {
      const r = await call("api_load");
      const local = S.folders;
      S.folders = []; apply(r.rows || [], true); since = r.rev || 0;
      if (!(r.rows || []).length && local.length) { S.folders = local; }    // empty server: the first person's data becomes the shared data
      ready = true; lastOk = new Date(); refresh(); schedule();
      ov.remove(); badge(); pollT = setTimeout(poll, 4000);
      if (!me()) setTimeout(() => { toast("ตั้งชื่อของคุณได้ที่ ตั้งค่า เพื่อให้คนอื่นรู้ว่าใครแก้"); }, 800);
    } catch (e) { ov.textContent = "โหลดข้อมูลร่วมไม่ได้: " + (e?.message || e) + " · ลองรีเฟรชหน้า"; }
  }
  $("#cloud").addEventListener("click", openSettings);
  window.addEventListener("beforeunload", e => { if (timer || pushing) { push(); e.preventDefault(); e.returnValue = ""; } });
  return { call, start, schedule, me, setMe: v => { lsSet(LS_ME, String(v || "").trim().slice(0, 40)); badge(); }, flush: push };
}

   Local edits are diffed and written right away (debounced); everyone's changes arrive by realtime.
   One person edits a pack at a time: whoever opens it first holds its lock, the others see who and can only look
   until that person leaves the pack (or closes the page / stays idle 10 minutes). The server enforces the same rule. */
const ROLE_TH = { admin:"ผู้ดูแล", editor:"แก้ไขได้", viewer:"ดูอย่างเดียว" };
function makeSupa(cfg){

  const ITEM_KEYS = new Set(["uid","itemId","name","amt","tp","tpGame","chance","fixed","custom"]);
  const extraOf = (o, keys) => { const e = {}; Object.keys(o).forEach(k => { if (!keys.has(k) && !k.startsWith("_") && o[k] !== undefined) e[k] = o[k]; }); return e; };

        image_url:String(p.image || ""), sold_count:pos0(int(p.sold)), extra:extraOf(p, PACK_KEYS) },

        chance:pos0(num(x.chance)), is_fixed:!!x.fixed, is_custom:!!x.custom, extra:extraOf(x, ITEM_KEYS) })) };

      start:r.start_date || "", startTime:r.start_time, end:r.end_date || "", endTime:r.end_time,

      items:(items || []).slice().sort((a, b) => a.position - b.position).map(x => ({ ...(x.extra || {}), uid:x.uid, itemId:x.item_id, name:x.name,
        amt:blank(x.amt), tp:blank(x.tp), tpGame:blank(x.tp_game), chance:blank(x.chance), fixed:!!x.is_fixed, ...(x.is_custom ? { custom:true } : {}) })) };

      const bk = backupFolders();
      if (canEdit() && bk.length && !lsGet(LS_MIGRATED)) setTimeout(() => toast(`มีข้อมูลเดิมในเครื่องนี้ ${bk.length} โฟลเดอร์ · ย้ายขึ้นระบบได้ที่ ตั้งค่า`), 900);
    } catch (e) {
      cover(`<div class="sb-card sb-wait">โหลดข้อมูลไม่ได้: ${esc(e?.message || e)}<br><button class="btn" onclick="location.reload()">ลองใหม่</button></div>`);
    }
  }
  function backupFolders(){ try { const d = JSON.parse(lsGet(LS_BACKUP) || "null"); return Array.isArray(d?.folders) ? d.folders.filter(f => (f.packs || []).length) : []; } catch { return []; } }

  /* ---- account, password, users (settings) ---- */
  function modal(html){
    const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="settings sb-dlg" role="dialog" aria-modal="true">${html}</div>`;
    document.body.append(m);
    const close = () => { m.remove(); document.removeEventListener("keydown", esc_); };
    const esc_ = e => { if (e.key === "Escape") close(); };
    m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) close(); });
    document.addEventListener("keydown", esc_);
    setTimeout(() => m.querySelector("input,select,button")?.focus(), 30);
    return { m, close };
  }
  async function api(body){
    const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + token }, body:JSON.stringify(body) });
    let d = {}; try { d = await r.json(); } catch {}
    if (!r.ok || !d.ok) throw new Error(d.error || `HTTP ${r.status}`);
    return d;
  }
  const copyBtn = v => `<button class="btn" data-copy="${esc(v)}">คัดลอก</button>`;
  document.addEventListener("click", async e => { const b = e.target.closest("[data-copy]"); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "คัดลอกแล้ว"; } catch { b.textContent = "คัดลอกไม่ได้"; } });
  function passwordDlg(){
    const { m, close } = modal(`<h3>เปลี่ยนรหัสผ่าน</h3><p>อย่างน้อย 8 ตัวอักษร</p>
      <div class="fld"><label for="pw1">รหัสผ่านใหม่</label><input id="pw1" type="password" autocomplete="new-password"></div>
      <div class="fld"><label for="pw2">พิมพ์อีกครั้ง</label><input id="pw2" type="password" autocomplete="new-password"></div>
      <p class="sb-err" id="pw-err" hidden></p>
      <div class="sb-acts"><span style="flex:1"></span><button class="btn" data-close>ยกเลิก</button><button class="btn pri" id="pw-go">บันทึกรหัสผ่าน</button></div>`);
    m.querySelector("#pw-go").addEventListener("click", async () => {
      const a = m.querySelector("#pw1").value, b = m.querySelector("#pw2").value, err = m.querySelector("#pw-err");
      const bad = a.length < 8 ? "รหัสผ่านต้องยาวอย่างน้อย 8 ตัว" : a !== b ? "รหัสผ่านสองช่องไม่ตรงกัน" : "";
      if (bad) { err.hidden = false; err.textContent = bad; return; }
      const { error } = await sb.auth.updateUser({ password:a });
      if (error) { err.hidden = false; err.textContent = "เปลี่ยนไม่ได้: " + error.message; return; }
      close(); toast("เปลี่ยนรหัสผ่านแล้ว");
    });
  }
  async function usersDlg(){
    const { m } = modal(`<h3>จัดการผู้ใช้</h3>
      <p>สร้างบัญชีให้ทีม · ระบบสร้างรหัสผ่านให้และแสดงครั้งเดียว คัดลอกส่งให้เจ้าของบัญชี แล้วให้เขาเปลี่ยนเองที่ ตั้งค่า → เปลี่ยนรหัสผ่าน</p>
      <form class="u-new" id="u-new">
        <div class="fld"><label for="u-name">ชื่อผู้ใช้ (ใช้ล็อกอิน)</label><input id="u-name" placeholder="เช่น sk" autocapitalize="none" spellcheck="false" required></div>
        <div class="fld"><label for="u-disp">ชื่อที่แสดง</label><input id="u-disp" placeholder="เช่น SK" maxlength="40"></div>
        <div class="fld"><label for="u-role">สิทธิ์</label><select id="u-role"><option value="editor">แก้ไขได้</option><option value="viewer">ดูอย่างเดียว</option><option value="admin">ผู้ดูแล</option></select></div>
        <button class="btn pri" id="u-add">สร้างบัญชี</button></form>
      <div class="u-out" id="u-out" hidden></div>
      <div class="u-list" id="u-list">กำลังโหลด…</div>
      <div class="sb-acts"><span style="flex:1"></span><button class="btn" data-close>ปิด</button></div>`);
    m.querySelector(".settings").classList.add("wide");
    const out = m.querySelector("#u-out");
    const show = (html, err) => { out.hidden = false; out.className = "u-out" + (err ? " err" : ""); out.innerHTML = html; };
    const passHTML = (u, pw, what) => `<b>${what} “${esc(u)}”</b><div class="u-pw"><span>ชื่อผู้ใช้ <code>${esc(u)}</code></span><span>รหัสผ่าน <code>${esc(pw)}</code></span>${copyBtn(`ชื่อผู้ใช้: ${u}\nรหัสผ่าน: ${pw}`)}</div><small>รหัสนี้จะไม่แสดงอีก</small>`;
    async function list(){
      try {
        const us = await P(sb.from("profiles").select("*").order("username"));
        us.forEach(u => NAMES.set(u.id, u.display_name || u.username));
        m.querySelector("#u-list").innerHTML = `<table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อที่แสดง</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr></thead><tbody>${us.map(u => {
          const self = u.id === me.id;
          return `<tr data-uid="${u.id}"><td><code>${esc(u.username)}</code>${self ? ` <small>(คุณ)</small>` : ""}</td>
            <td><input data-ufield="display_name" value="${esc(u.display_name)}" maxlength="40" aria-label="ชื่อที่แสดงของ ${esc(u.username)}"></td>
            <td><select data-ufield="role" ${self ? "disabled" : ""} aria-label="สิทธิ์ของ ${esc(u.username)}">${Object.entries(ROLE_TH).map(([k, v]) => `<option value="${k}"${u.role === k ? " selected" : ""}>${v}</option>`).join("")}</select></td>
            <td><button class="btn u-act ${u.active ? "on" : "off"}" data-uact="toggle" ${self ? "disabled" : ""}>${u.active ? "เปิดใช้งาน" : "ปิดอยู่"}</button></td>
            <td><button class="linkbtn" data-uact="reset">รีเซ็ตรหัสผ่าน</button></td></tr>`; }).join("")}</tbody></table>`;
      } catch (e) { m.querySelector("#u-list").textContent = "โหลดรายชื่อไม่ได้: " + (e?.message || e); }
    }
    m.querySelector("#u-new").addEventListener("submit", async e => {
      e.preventDefault(); const b = m.querySelector("#u-add"); b.disabled = true;
      try { const d = await api({ action:"create", username:m.querySelector("#u-name").value, display_name:m.querySelector("#u-disp").value, role:m.querySelector("#u-role").value });
        show(passHTML(d.username, d.password, "สร้างบัญชี")); m.querySelector("#u-new").reset(); list(); }
      catch (err) { show(esc(err.message), true); }
      b.disabled = false;
    });
    m.querySelector("#u-list").addEventListener("change", async e => {
      const f = e.target.dataset.ufield; if (!f) return; const id = e.target.closest("tr").dataset.uid;
      try { await api({ action:"update", id, [f]:e.target.value }); toast("บันทึกแล้ว"); list(); } catch (err) { show(esc(err.message), true); list(); }
    });
    m.querySelector("#u-list").addEventListener("click", async e => {
      const b = e.target.closest("[data-uact]"); if (!b) return; const tr = b.closest("tr"), id = tr.dataset.uid, name = tr.querySelector("code").textContent;
      try {
        if (b.dataset.uact === "toggle") { await api({ action:"update", id, active:!b.classList.contains("on") }); list(); }
        if (b.dataset.uact === "reset") { if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "กดอีกครั้งเพื่อรีเซ็ต"; return; }
          const d = await api({ action:"reset", id }); show(passHTML(name, d.password, "รหัสผ่านใหม่ของ")); list(); }
      } catch (err) { show(esc(err.message), true); }
    });
    list();
  }
  function migrate(){
    const bk = backupFolders(); if (!bk.length) return;
    const n = importData({ folders:JSON.parse(JSON.stringify(bk)), memo:(() => { try { return JSON.parse(lsGet(LS_BACKUP)).memo || {}; } catch { return {}; } })() }, "ข้อมูลในเครื่อง");
    if (n) lsSet(LS_MIGRATED, String(Date.now()));
  }
  function account(el){
    const bk = backupFolders(), moved = !!lsGet(LS_MIGRATED);
    el.innerHTML = `<div class="acct"><div><b>${esc(meName())}</b> <small>${esc(me.username)} · ${ROLE_TH[me.role] || me.role}</small></div>
      <div class="acct-acts"><button class="btn" data-acct="pw">เปลี่ยนรหัสผ่าน</button>${me.role === "admin" ? `<button class="btn" data-acct="users">จัดการผู้ใช้</button>` : ""}
      <button class="btn" data-acct="out">ออกจากระบบ</button></div>
      ${canEdit() && bk.length ? `<p class="acct-mig">ข้อมูลเดิมในเครื่องนี้ ${bk.length} โฟลเดอร์${moved ? " (ย้ายไปแล้ว)" : ""} · <button class="linkbtn" data-acct="mig">${moved ? "ย้ายขึ้นระบบอีกครั้ง" : "ย้ายขึ้นระบบ"}</button></p>` : ""}
      <p>นำเข้าไฟล์ .json เดิม: กด “นำเข้า JSON” ที่แถบด้านบน ข้อมูลจะถูกเพิ่มเป็นโฟลเดอร์ใหม่และบันทึกขึ้นระบบทันที</p></div>`;
    el.onclick = async e => { const a = e.target.closest("[data-acct]")?.dataset.acct; if (!a) return;
      if (a === "pw") { $("#settings-modal").hidden = true; passwordDlg(); }
      if (a === "users") { $("#settings-modal").hidden = true; usersDlg(); }
      if (a === "mig") { $("#settings-modal").hidden = true; migrate(); }
      if (a === "out") { ready = false; for (let i = 0; lockBusy && i < 50; i++) await new Promise(r => setTimeout(r, 100));
        held = null; try { await sb.rpc("release_my_locks"); } catch {} await sb.auth.signOut(); location.reload(); } };
  }
  $("#cloud").addEventListener("click", openSettings);
  const bar = document.createElement("div"); bar.className = "lockbar"; bar.id = "lockbar"; bar.hidden = true; bar.setAttribute("role", "status");
  $("#editor").before(bar);
  $("#btn-open").textContent = "นำเข้า JSON"; $("#btn-open").title = "เพิ่มโฟลเดอร์จากไฟล์ .json เดิม แล้วบันทึกขึ้นระบบ";
  return { sb:true, start, schedule, me:meName, account, flush:push, canEdit, lockedBy:id => { const w = lockedBy(id); return w === VIEW_ONLY ? "" : w; } };
}

/* ---------- boot ---------- */
const th = lsGet("tosm-pack-builder:theme"); if (th) document.documentElement.dataset.theme = th;
try { const cached = JSON.parse(lsGet(LS_ITEMS) || "null"); if (Array.isArray(cached) && cached.length) setItems(cached); } catch {}
if (window.TOSM_CONFIG?.supabaseUrl && window.TOSM_CONFIG?.supabaseKey) CLOUD = makeSupa(window.TOSM_CONFIG);      // Vercel + Supabase
else if (typeof google !== "undefined" && google.script?.run) CLOUD = makeCloud();                                   // Apps Script web app
save(false); // persist any migration of older saved packs
showView("home");
CLOUD?.start();
if (S.dirty) markDirty();
$("#btn-save").title = "บันทึกโปรโมชันเป็นไฟล์ .json เพื่อเปิดต่อในเครื่องอื่นหรือส่งให้คนอื่น";
fetchItems();
if (!CLOUD && !S.settings.api && !ITEMS.length) setTimeout(openSettings, 300);
})();
</script>
</body>
</html>
