<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOSM Pack Builder</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Kanit:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: item library | workspace (pack tabs, form + table, sticky summary) — stacks to one column on narrow screens. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f6f8fa; --ink:#16202b; --muted:#5b6876; --line:#d5dbe2;
  --navy:#1d3a5c; --navy-ink:#ffffff; --accent:#c9861a; --accent-soft:#f6e7cc; --accent-ink:#3d2700;
  --good:#1f8a5b; --good-soft:#dff2e8; --warn:#b8541a; --warn-soft:#fbe6d8; --bad:#c23a3a; --bad-soft:#fbe3e3; --chip:#e4e9ef;
  --g-trainee:#8a9099; --g-common:#7cc977; --g-rare:#3b8fe0; --g-unique:#8a55d1; --g-epic:#d8423f;
  --g-legend:#e2bd16; --g-r:#8b5a2b; --g-sr:#d4a017; --g-goddess:#00c49a; --g-ur:#f4c6ff; --g-cel:#3a55ff;
  --g-ur-fx:conic-gradient(from 210deg,#ff6b6b,#ffd93d,#fffbe6,#6bff95,#6bd5ff,#ffffff,#c46bff,#ff6bd5,#ff6b6b);
  --g-cel-fx:conic-gradient(from 200deg,#141a5c,#3a55ff,#00d4ff,#a8f0ff,#8a3fff,#ff4fd8,#3a55ff,#141a5c);
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; color-scheme:light;
  --z-set:#e8f0fb; --z-set-line:#bcd0ea; --z-set-ink:#2a5d9c; --z-itm:#eaf6ee; --z-itm-line:#bfdfc9; --z-itm-ink:#237a4c;
  --t-rank-bronze:#7a4320; --t-rank-silver:#8a949e; --t-rank-gold:#c49316; --t-new:#3aae3f; --t-best-seller:#e0242b; --t-best-hot:#ff5a1f;
  --t-limited:#7d7d7d; --t-event:#7b3fd1; --t-sale:#e0377f; --t-flashsale:#f08a18; --t-recommend:#0f9e9e; --t-mileage:#2f6fd6; --t-step-up:#1592cf;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#17202a; --panel-2:#1c2733; --ink:#e6ecf2; --muted:#94a3b3; --line:#2a3644;
  --navy:#23415f; --navy-ink:#eef4fb; --accent:#e3a33a; --accent-soft:#3a2c14; --accent-ink:#fbe9c8;
  --good:#45b884; --good-soft:#163628; --warn:#e48a4f; --warn-soft:#3a2416; --bad:#e86a6a; --bad-soft:#3d1d1d; --chip:#213040; color-scheme:dark; --z-set:#15223a; --z-set-line:#2c4568; --z-set-ink:#8fb8ee; --z-itm:#13281e; --z-itm-line:#2a4f3b; --z-itm-ink:#7fd1a2;}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#17202a; --panel-2:#1c2733; --ink:#e6ecf2; --muted:#94a3b3; --line:#2a3644;
  --navy:#23415f; --navy-ink:#eef4fb; --accent:#e3a33a; --accent-soft:#3a2c14; --accent-ink:#fbe9c8;
  --good:#45b884; --good-soft:#163628; --warn:#e48a4f; --warn-soft:#3a2416; --bad:#e86a6a; --bad-soft:#3d1d1d; --chip:#213040; color-scheme:dark; --z-set:#15223a; --z-set-line:#2c4568; --z-set-ink:#8fb8ee; --z-itm:#13281e; --z-itm-line:#2a4f3b; --z-itm-ink:#7fd1a2;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:var(--navy);color:var(--navy-ink)}
.brand{font:700 18px/1 var(--f-display);letter-spacing:.02em;display:flex;gap:8px;align-items:center}
.brand small{font:500 11px var(--f-mono);opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:3px;border-radius:999px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:999px;cursor:pointer;color:var(--navy-ink)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#1b1100;font-weight:600}
.top .spacer{flex:1}
.tbtn{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--navy-ink);padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.12)}
.status{font-size:12px;opacity:.85;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* main grid: library | workspace (pack tabs → [form + table | sticky summary]) */
.app{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:12px;padding:12px 16px;height:calc(100% - 52px)}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.col h2{font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.colhead{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.scroll{overflow:auto;min-height:0;flex:1}

/* library */
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);font-size:12px;max-width:100%;flex:1 1 120px}
.views{display:flex;gap:4px;flex-wrap:wrap}
.views button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 12px;font-size:12px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.libcount{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:8px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);cursor:pointer;text-align:center;user-select:none;transition:border-color .12s,transform .12s}
.it:hover{border-color:var(--accent);transform:translateY(-1px)}
.it.in{border-color:var(--accent);background:var(--accent-soft)}
.it .nm{font-size:11px;line-height:1.25;max-height:2.5em;overflow:hidden;word-break:break-word}
.it .id{font:10px var(--f-mono);color:var(--muted)}
.it .inpk{position:absolute;top:3px;right:3px;font:700 10px var(--f-mono);padding:1px 5px;border-radius:999px;background:var(--accent);color:#1b1100}
.it .tr{position:absolute;top:3px;left:3px;font:600 9px var(--f-body);padding:0 4px;border-radius:3px;background:var(--good-soft);color:var(--good)}
.it .uses{font:10px var(--f-mono);color:var(--accent)}
.ico{width:44px;height:44px;border-radius:6px;border:2px solid var(--gc,var(--g-common));background:var(--chip) center/contain no-repeat;display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--muted);overflow:hidden;flex:none}
.ico img{width:100%;height:100%;object-fit:contain}
/* UR = bright rainbow with white, Celestial = cosmic-blue rainbow: a gradient ring behind the tile */
.ico.gx-ur,.ico.gx-cel{border-color:transparent;background:linear-gradient(var(--chip),var(--chip)) padding-box,var(--g-ur-fx) border-box}
.ico.gx-cel{background:linear-gradient(var(--chip),var(--chip)) padding-box,var(--g-cel-fx) border-box}
.ico.sm{width:36px;height:36px}

.hint{font-size:11px;color:var(--muted);font-weight:400}
.fld.full{grid-column:1/-1}
.fld.img{grid-column:span 2}
@media (max-width:560px){.fld.img{grid-column:1/-1}}
.imgrow{display:flex;gap:8px;align-items:center}
.imgprev{width:36px;height:36px;flex:none;border-radius:6px;border:1px solid var(--line);background:var(--chip);overflow:hidden;display:grid;place-items:center}
.imgprev img{width:100%;height:100%;object-fit:contain}
.imgprev.bad{border-color:var(--warn)}
.opt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tchip{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:999px;padding:4px 12px;font:600 12px var(--f-body);letter-spacing:.02em;cursor:pointer}
.tchip[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff}
.cchip-w{display:inline-flex;align-items:center}
.cchip{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:5px 12px;cursor:pointer}
.cchip[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:600}
.cchip-w .cchip:has(+ .cdel){border-radius:6px 0 0 6px}
.cdel{border:1px solid var(--line);border-left:0;background:var(--panel-2);color:var(--muted);border-radius:0 6px 6px 0;padding:5px 7px;cursor:pointer}
.cdel:hover{color:var(--bad)}
.addcat{display:inline-flex;gap:4px}
.addcat input{width:150px;padding:5px 8px;border:1px dashed var(--line);border-radius:6px;background:var(--panel)}
.addcat .btn{padding:5px 10px}
.resetbox{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.resetbox .fld input[type=number]{width:110px}
.rsched{margin-top:6px;font-size:12px;line-height:1.6;color:var(--muted);padding:8px 10px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line)}
.rsched b{color:var(--ink)}
.warnt{color:var(--warn)}

.azrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:12px}
.azrow label{color:var(--muted)}
.azrow select,.azrow input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);max-width:100%}
.azrow input{min-width:240px}
.azset summary{cursor:pointer;font-weight:600}
#s-az{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
#s-az .fld{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}


/* colour zones: blue = pack settings, green = items */
/* variant A sections (used in step 2), with a little more room than A: 20px inside, 14/16px between fields, 24px between sections */
.zone{margin:0;border:1px solid var(--zl);border-radius:12px;background:var(--zb)}
.zone + .zone{margin-top:24px}
.sec-h{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--zl)}
.sec-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--zi);color:var(--panel);font:700 14px var(--f-display)}
.sec-t{flex:1;min-width:0}
.sec-t h3{margin:0;font:600 16px var(--f-display);color:var(--ink);letter-spacing:.01em}
.sec-t p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.sec-st::before{content:none}
.sec-st.ok::before{content:"✓ "}
.opt-l{font-size:11px;color:var(--muted);font-weight:400}
.fld.wide2{grid-column:span 2}
@media (max-width:560px){.fld.wide2{grid-column:1/-1}}
.fld > .seg{align-self:flex-start}
.az-f select{max-width:560px}.az-f #p-azc{margin-top:6px;max-width:560px}
.zone .packhead{padding:20px;gap:14px 16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.zone .fld{gap:5px}
.zone .fld label,.zone .fld .lbl{font-size:12px;font-weight:500;color:var(--ink);opacity:.85}
.zone .fld input:not([type=checkbox]),.zone .fld select,.zone .fld textarea{padding:8px 10px;min-height:38px}
.zone .fld textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;resize:vertical;min-height:60px}
.zone .resetbox{gap:14px 18px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px!important;opacity:1!important;cursor:pointer;min-height:38px}
.chk input{width:18px!important;height:18px;margin:0;accent-color:var(--z-set-ink)}
.b-panel.set{background:none;border:0;padding:0}
.b-panel.set .b-head{padding:0 4px}
.b-panel.set .b-nav{border-top-color:var(--line)}
.zone-set{--zb:var(--z-set);--zl:var(--z-set-line);--zi:var(--z-set-ink)}
.zone-itm{--zb:var(--z-itm);--zl:var(--z-itm-line);--zi:var(--z-itm-ink)}
.zone .packhead{border-bottom:0}
.zone .fld input,.zone .fld select,.zone .azrow select,.zone .azrow input,.zone .addcat input,.zone .rsched,.zone td .cell,
.zone .seg button:not([aria-pressed="true"]),.zone .tchip:not([aria-pressed="true"]),.zone .cchip:not([aria-checked="true"]),.zone .cdel,.zone .btn:not(.pri){background:var(--panel)}
.zone .drop{background:var(--panel)}
.zone-set .seg button[aria-pressed="true"],.zone-set .cchip[aria-checked="true"]{background:var(--zi);border-color:var(--zi);color:var(--panel)}
.zone .drop.over{background:var(--accent-soft)}
.lib-col{border-top:4px solid var(--z-itm-ink)}
.lib-col .colhead{background:var(--z-itm);border-bottom-color:var(--z-itm-line)}
.lib-col .colhead h2{color:var(--z-itm-ink)}

/* paste-from-sheet modal */
.settings.pv{width:min(860px,100%)}
.pv textarea{width:100%;min-height:150px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);font:12px/1.5 var(--f-mono);color:var(--ink);tab-size:16}
.pv-opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.pv-sum{font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.pv .tblwrap{max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
.pv td{font-size:12px}
.pv td small{display:block;color:var(--muted);font-size:10.5px}
.pv tr.bad td{background:var(--warn-soft)}

/* shared (cloud) sync status */
.cloud{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--navy-ink);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.cloud.err{background:#a33;border-color:#a33}
.cloud.busy{opacity:.8}
.cl-load{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:600 16px var(--f-display)}

/* workspace */
.editor{padding:0}
.packbar{display:flex;gap:6px;align-items:stretch;padding:8px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--panel-2);border-radius:var(--r) var(--r) 0 0}
.pk{flex:0 0 auto;display:grid;grid-template-columns:auto auto;gap:0 10px;align-items:baseline;padding:6px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--panel);text-align:left;max-width:260px}
.pk[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.pk .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;grid-column:1/-1}
.pk .p{font:600 12px var(--f-mono)}
.pk .m{font-size:11px;color:var(--muted);text-align:right}
.pk.add{display:flex;align-items:center;border-style:dashed;color:var(--muted)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;align-items:start}
.work .main{min-width:0;border-right:1px solid var(--line)}
.aside{position:sticky;top:0;padding:14px;display:flex;flex-direction:column;gap:12px}
.packhead{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 10px;border-bottom:1px solid var(--line)}
.fld.when{grid-column:span 2}
@media (max-width:560px){.fld.when{grid-column:1/-1}}
.packhead .wide{grid-column:1/-1;display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld label{font-size:11px;color:var(--muted);letter-spacing:.02em}
.fld input,.fld select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);min-width:0;width:100%}
.fld.name{flex:1;min-width:200px}
.fld.name input{font:600 17px var(--f-display);padding:6px 10px}
.dt{display:flex;gap:4px}
.dt input[type=date]{flex:1 1 140px;min-width:140px}
.dt input[type=time]{flex:0 0 108px;width:108px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.derived{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.derived b{color:var(--ink);font-weight:600}

.drop{margin:12px;border:2px dashed var(--line);border-radius:var(--r);min-height:120px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .empty{padding:28px 16px;text-align:center;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px var(--f-body);color:var(--navy-ink);background:var(--navy);text-align:left;padding:6px 6px;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.dragging{opacity:.4}
td .cell{width:66px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);text-align:right}
td .cell[data-k="chance"]{width:84px}
td .cell.w{width:100%;min-width:120px;text-align:left}
td .nmc{display:flex;align-items:center;gap:8px;min-width:170px}
td .nmc .t{display:flex;flex-direction:column;line-height:1.25}
td .nmc .t small{font:10px var(--f-mono);color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--warn-soft)}
.grip{cursor:grab;color:var(--muted);user-select:none;padding:4px 2px;display:inline-block}
.cust{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.cust .cell{width:100%;text-align:left}
.cust small{font-size:10px;color:var(--muted)}
.fx{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap}
tfoot td{font-weight:600;background:var(--panel-2)}
td small.sub{display:block;font:10px var(--f-mono);color:var(--muted)}
/* random sections */
tr.sec td{background:var(--panel-2);padding:8px;border-bottom:1px solid var(--line)}
tr.sec .st{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
tr.sec .st b{font:600 13px var(--f-display);letter-spacing:.02em}
tr.sec .st .hint{font-size:11px;color:var(--muted)}
tr.sec.over td{background:var(--accent-soft)}
.pill{display:inline-block;font:600 11px var(--f-body);padding:1px 8px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.meter{flex:1 1 140px;max-width:260px;height:8px;border-radius:999px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:999px}
.meter.warn i{background:var(--warn)}
.chcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.chbar{width:70px;height:6px;border-radius:999px;background:var(--chip);overflow:hidden;flex:none}
.chbar i{display:block;height:100%;background:var(--accent)}
.odds{font:10px var(--f-mono);color:var(--muted);display:block;text-align:right}
.mv{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:5px;font-size:11px;padding:2px 6px;cursor:pointer;white-space:nowrap}
.mv:hover{border-color:var(--accent);color:var(--ink)}
tr.empty-row td{color:var(--muted);text-align:center;padding:14px;font-size:12px}
.acts{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.miss{background:var(--warn-soft)!important;border-color:var(--warn)!important}
.edbar{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1100;font-weight:600}

/* simulation */
.sim{margin:4px 12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.sim-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;padding:12px;border-bottom:1px solid var(--line);background:var(--panel-2);border-radius:var(--r) var(--r) 0 0}
.sim-h h3{margin:0;font:600 15px var(--f-display);width:100%}
.sim-h .fld input{width:110px}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chips input{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.sim-b{padding:12px;display:flex;flex-direction:column;gap:14px}
.sim-note{font-size:12px;color:var(--muted)}
.sim-note.warn{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:11px;color:var(--muted)}
.kpi .v{font:700 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--muted)}
.buckets{display:flex;flex-wrap:wrap;gap:6px}
.bk{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip)}
.bk b{font-variant-numeric:tabular-nums}
.sim h4{margin:0;font:600 13px var(--f-display);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.sim table th{position:sticky;top:0}
.got{display:flex;flex-wrap:wrap;gap:4px}
.gchip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 2px;border-radius:999px;background:var(--chip);font:500 11px var(--f-body);white-space:nowrap}
.gchip b{font:600 11px var(--f-mono)}
#sim-sort{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.gchip .ico{width:20px;height:20px;border-width:1px;border-radius:50%;font-size:8px}
.gchip.top{background:var(--accent-soft);color:var(--accent-ink)}
.pos{color:var(--good)} .neg{color:var(--warn)}
.simtbl{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.simbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* per-person average haul — the headline of a simulation */
.haul{border:2px solid var(--accent);border-radius:12px;background:var(--accent-soft);padding:14px;display:flex;flex-direction:column;gap:12px}
.haul-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.haul-h b{font:700 20px/1.25 var(--f-display);color:var(--accent-ink)}
.haul-h span{font-size:13px;color:var(--accent-ink);opacity:.85}
.haul-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.hi .ico{width:56px;height:56px}
.hi .q{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.hi .q small{font:600 13px var(--f-body);color:var(--muted);margin-left:3px}
.hi .nm{font-size:12px;line-height:1.3;max-height:2.6em;overflow:hidden;word-break:break-word}
.hi .meta{font-size:11px;color:var(--muted)}
.hi.fixed{border-color:var(--good)}
.hi.rare .q{color:var(--accent)}
.haul-f{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--accent-ink)}
.haul-f b{font-variant-numeric:tabular-nums}

.haul-list{display:flex;flex-direction:column;gap:6px}
.hl{display:grid;grid-template-columns:48px minmax(0,1fr) auto;grid-template-areas:"i n q" "i s s";align-items:center;gap:2px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px 8px 8px}
.hl .ico{grid-area:i;width:48px;height:48px}
.hl-n{grid-area:n;font-size:15px;font-weight:500;min-width:0}
.hl-q{grid-area:q;font-size:15px;white-space:nowrap;text-align:right}
.hl-q b{font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums;margin:0 2px}
.hl-q .none{font-size:14px;color:var(--muted)}
.hl-s{grid-area:s;font-size:13px;color:var(--accent-ink)}
.hl-s b{font-variant-numeric:tabular-nums}
.hl:not(.rare) .hl-s{display:none}
.haul-f{display:block;font-size:14px;line-height:1.6;color:var(--accent-ink)}
.pl-v b{font-variant-numeric:tabular-nums}
details.dd{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
details.dd>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.dd[open]>summary::before{transform:rotate(90deg)}
details.dd>summary:hover{color:var(--accent)}
.dd-b{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.say{margin:0;font-size:14px;line-height:1.6}
.who{display:flex;flex-direction:column;gap:6px}
.who-r{display:grid;grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"i n q" "i b b";gap:2px 10px;align-items:center}
.who-r .ico{grid-area:i}
.who-n{grid-area:n;min-width:0}
.who-q{grid-area:q;font-size:13px;white-space:nowrap}
.who-q b{font-variant-numeric:tabular-nums}
.who-bar{grid-area:b;height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.who-bar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted)}
.plist{display:flex;flex-direction:column;max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.pl{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.pl-no{font-size:12px;color:var(--muted)}
.pl-v{font-size:13px;font-weight:600;white-space:nowrap;text-align:right}
.kv.wide{grid-template-columns:minmax(0,1fr) auto}
@media (max-width:640px){.pl{grid-template-columns:1fr}.pl-v{text-align:left}}

/* summary */
.aside h2{font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big .v{font:700 40px/1 var(--f-display)}
.big .l{font-size:12px;color:var(--muted)}
.verdict{display:inline-block;font:600 12px var(--f-body);padding:2px 10px;border-radius:999px;background:var(--chip)}
.verdict.disc-good{background:var(--good-soft)} .verdict.disc-mid{background:var(--accent-soft)} .verdict.disc-low{background:var(--warn-soft)}
.story{font-size:13px;line-height:1.55;padding:10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.story b{font-variant-numeric:tabular-nums}
.sub-h{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.foot{font-size:11px;color:var(--muted);line-height:1.45}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.warns{display:flex;flex-direction:column;gap:4px}
.wn{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;font-size:12px;line-height:1.45;padding:6px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);cursor:pointer}
.wn.err{background:var(--bad-soft);color:var(--bad)}
.wn:hover{outline:1px solid currentColor}
.wn .ic{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--f-mono);background:currentColor}
.wn .ic{color:inherit}.wn .ic{background:none;border:1.5px solid currentColor}
.wh{display:flex;gap:8px;font-size:12px;margin-bottom:2px}.wh .e{color:var(--bad)}.wh .w{color:var(--warn)}
/* field-level validation */
.req{color:var(--bad);font-weight:700;margin-left:2px}
.v-err:is(input,select),.v-err :is(input,select){border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.v-warn:is(input,select),.v-warn :is(input,select){border-color:var(--warn)!important}
.vmsg{display:block;font-size:11px;line-height:1.35;margin-top:2px}
.vmsg.err{color:var(--bad)}.vmsg.warn{color:var(--warn)}
@keyframes vflash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.v-flash{animation:vflash 1.2s ease-out}
.ok{font-size:12px;padding:6px 8px;border-radius:6px;background:var(--good-soft);color:var(--good)}
.disc-good{color:var(--good)} .disc-mid{color:var(--accent)} .disc-low{color:var(--warn)}

/* save menu + export modal */
.save-menu{position:fixed;z-index:22;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.28);padding:6px;display:flex;flex-direction:column;width:min(330px,calc(100% - 16px))}
.save-menu button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.save-menu button:hover:not(:disabled){background:var(--panel-2)}
.save-menu button:disabled{opacity:.45;cursor:not-allowed}
.save-menu small{font-size:11.5px;color:var(--muted)}
.settings.xl{width:min(820px,100%)}
.xl select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.xl-bar{display:flex;gap:14px}
.xl-list{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.xl-p{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer}
.xl-p.bad{cursor:default;opacity:.95;border-color:var(--warn)}
.xl-p input{margin-top:3px}
.xl-n{display:flex;flex-direction:column;gap:2px;min-width:0}
.xl-n small{color:var(--muted);font-size:12px}
.xl-e{font-size:12px;color:var(--bad)}
.xl-w{font-size:12px;color:var(--warn)}
.xl-sum{font-size:14px}
.xl-prev summary{cursor:pointer;color:var(--muted);font-size:13px}
.xl-prev .tblwrap{max-height:40vh;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:6px}
.xl-prev td{font-size:12px;white-space:nowrap}
.xl-prev h4{margin:10px 0 4px;font:600 12px var(--f-display);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.xl-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.xl-top .fld{min-width:220px}

/* home dashboard — promotion folders */
#view-home{min-height:calc(100% - 52px)}
.crumb{font:600 13px var(--f-body);background:rgba(255,255,255,.12);padding:4px 10px;border-radius:6px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
.hm{max-width:1280px;margin:0 auto;padding:22px 16px 48px;display:flex;flex-direction:column;gap:18px}
.hm-hero{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between}
.hm-title h1{margin:0;font:700 28px/1.15 var(--f-display);letter-spacing:.01em}
.hm-title p{margin:4px 0 0;color:var(--muted)}
.hm-title .live{color:var(--good)}
.hm-cta{display:flex;gap:8px;flex-wrap:wrap}
.btn.big{padding:9px 18px;font-size:15px}
.hm-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.hm-q{flex:1 1 260px;width:auto}
.hm-period{display:flex;gap:4px;flex-wrap:wrap}
.hm-chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.hm-chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.hm-range{display:flex;gap:6px;align-items:center}
.hm-range input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
#hm-sort{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.hm-hits{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.hm-hits h2{margin:0 0 4px;font:600 13px var(--f-display);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.hm-hit{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 10px;cursor:pointer}
.hm-hit:hover{border-color:var(--accent)}
.hm-hit .nm small{display:block;color:var(--muted);font-size:11px}
.hm-hit .pr{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hm-hit .pr small{display:block;font-size:11px;font-weight:500}
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px 18px;padding-top:14px}
.hm-f{position:relative;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--fc);border-radius:0 12px 12px 12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;min-width:0}
.hm-f:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.hm-f:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hm-f.cur{box-shadow:0 0 0 2px var(--fc)}
.hm-tab{position:absolute;left:-1px;top:-18px;width:96px;height:16px;background:var(--fc);border-radius:8px 10px 0 0;clip-path:polygon(0 0,82% 0,100% 100%,0 100%)}
.hm-fh{display:flex;align-items:start;gap:8px}
.hm-fh h3{margin:0;flex:1;min-width:0;font:600 18px/1.3 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-rn{flex:1;min-width:0;font:600 16px var(--f-display);padding:4px 8px;border:1px solid var(--accent);border-radius:6px;background:var(--panel-2)}
.hm-menu{position:relative}
.hm-mbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px;line-height:1}
.hm-pop{position:absolute;right:0;top:32px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 26px rgba(0,0,0,.25);display:flex;flex-direction:column;min-width:210px;padding:4px}
.hm-pop>button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:5px;cursor:pointer}
.hm-pop>button:hover{background:var(--panel-2)}
.hm-pop .danger{color:var(--bad)}
.hm-colors{display:flex;gap:6px;padding:6px 10px}
.hm-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--panel);background:var(--dc);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.hm-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.hm-st{font:600 11px var(--f-body);padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.hm-st.live{background:var(--good-soft);color:var(--good)}
.hm-st.soon{background:var(--accent-soft);color:var(--accent)}
.hm-st.done{background:var(--chip);color:var(--muted);text-decoration:line-through}
.hm-thumbs{display:flex;gap:6px;align-items:center;min-height:56px}
.hm-th{width:56px;height:56px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.hm-th img{max-width:90%;max-height:90%;object-fit:contain}
.hm-th .ico{width:44px;height:44px}
.hm-th.sm{width:40px;height:40px}
.hm-th.sm .ico{width:32px;height:32px;font-size:9px}
.hm-more{font:600 12px var(--f-mono);color:var(--muted);padding:0 4px}
.hm-empty{font-size:12px;color:var(--muted)}
.hm-stats{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.hm-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.hm-cats{display:flex;flex-wrap:wrap;gap:4px}
.hm-cats span{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--chip)}
.hm-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.hm-acts .btn{padding:5px 10px;font-size:13px}
.hm-upd{font-size:11px;color:var(--muted)}
.hm-newf{--fc:var(--line);border-style:dashed;border-top-style:solid;align-items:center;justify-content:center;text-align:center;min-height:240px;color:var(--muted);font-size:15px}
.hm-newf .plus{font:300 44px/1 var(--f-display);color:var(--accent)}
.hm-newf small{font-size:12px}
.hm-newf:hover{color:var(--ink)}
.hm-none{text-align:center;color:var(--muted);padding:20px}

/* board view — one column per pack, grouped by category */
#view-board{min-height:calc(100% - 52px)}
.bd{padding:12px 16px 40px}
.bd-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
.bd-bar h1{margin:0;font:600 18px var(--f-display);flex:1;min-width:180px}
.bd-bar .note{font-size:12px;color:var(--muted)}
.bd-legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bd-legend i{width:12px;height:12px;border-radius:3px;background:var(--accent-soft);outline:2px solid var(--accent)}
.bd-scroll{overflow-x:auto;padding-bottom:12px}
.bd-row{display:flex;gap:28px;align-items:flex-start;width:max-content;min-width:100%}
.bd-grp{display:flex;flex-direction:column;gap:8px}
.bd-grp>h2{margin:0 0 0 4px;font:600 13px var(--f-display);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.bd-cols{display:flex;gap:12px;align-items:stretch}
.bcol{width:270px;flex:none;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .12s}
.bcol.isnew{border-color:var(--accent)}
.bcol.over{border-color:var(--accent);background:var(--accent-soft)}
.bcol.dragging{opacity:.45}
.bc-h{background:var(--navy);color:var(--navy-ink);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.bc-t{display:flex;align-items:center;gap:6px}
.bc-grip{cursor:grab;opacity:.7;user-select:none;padding:2px}
.bc-name{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:5px;color:inherit;font:600 15px var(--f-display);padding:3px 5px}
.bc-name:hover,.bc-name:focus{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.bc-menu-btn{border:0;background:rgba(255,255,255,.12);color:inherit;border-radius:5px;width:26px;height:26px;cursor:pointer;font-size:16px;line-height:1}
.bc-tags{display:flex;gap:4px;flex-wrap:wrap}
.bc-tag{font:600 10px var(--f-body);padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.bc-menu{position:relative}
.bc-pop{position:absolute;right:0;top:30px;z-index:5;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;min-width:170px;padding:4px}
.bc-pop button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:5px;cursor:pointer}
.bc-pop button:hover{background:var(--panel-2)}
.bc-pop button.danger{color:var(--bad)}
.bc-s{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--line)}
.bc-disc{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bc-disc .v{font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.bc-disc .l{font-size:11px;color:var(--muted)}
.bc-f{display:flex;flex-direction:column;gap:2px;min-width:0}
.bc-f label{font-size:10.5px;color:var(--muted)}
.bc-f input{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.bc-f .sub{font:10px var(--f-mono);color:var(--muted)}
.bc-f .ro{font-weight:600;font-variant-numeric:tabular-nums;padding:5px 0}
.bc-more{grid-column:1/-1;font-size:12px}
.bc-more summary{cursor:pointer;color:var(--muted)}
.bc-more .kv{margin-top:6px;font-size:12px}
.bc-more .go{margin-top:6px}
.chg{outline:2px solid var(--accent)!important;background:var(--accent-soft)!important}
.bc-items{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:60px}
.bi{background:var(--panel-2);border:1px solid var(--line);border-radius:8px}
.bi.dragging{opacity:.4}
.bi.over{box-shadow:0 -3px 0 var(--accent)}
.bi-r{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:5px 6px 5px 5px;cursor:pointer}
.bi-r .ico{width:40px;height:40px}
.bi-n{font-size:12.5px;line-height:1.25;max-height:2.5em;overflow:hidden;word-break:break-word}
.bi-n small{display:block;font:10px var(--f-mono);color:var(--muted)}
.bi-q{font:600 13px var(--f-mono);text-align:right;white-space:nowrap}
.bi-q .pill{display:block;margin-top:2px;font-size:10px;padding:0 6px}
.bi-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 5px;border-radius:4px}
.bi-x:hover{color:var(--bad);background:var(--warn-soft)}
.bi.new{border-color:var(--accent);background:var(--accent-soft)}
.bi .nb{font:700 9px var(--f-body);color:#1b1100;background:var(--accent);border-radius:999px;padding:0 5px;margin-left:4px;vertical-align:1px}
.bi-e{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px 8px}
.bi-e .bc-f.full{grid-column:1/-1}
.bi-e .seg button{padding:4px 10px;font-size:12px}
.bc-gone{font-size:11px;color:var(--muted);padding:0 4px}
.bc-gone s{opacity:.8}
.bc-add{padding:0 8px 10px}
.bc-add>button{width:100%;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;cursor:pointer;color:var(--muted)}
.bc-add>button:hover{border-color:var(--accent);color:var(--ink)}
.bc-srch{display:flex;flex-direction:column;gap:4px}
.bc-srch input{width:100%;padding:7px 9px;border:1px solid var(--accent);border-radius:8px;background:var(--panel)}
.bc-res{display:flex;flex-direction:column;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.bc-res button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:5px 7px;cursor:pointer;font-size:12px}
.bc-res button:hover{background:var(--panel-2)}
.bc-res .ico{width:28px;height:28px;font-size:8px;border-width:1px}
.bc-res small{display:block;font:10px var(--f-mono);color:var(--muted)}
.bc-warn{font-size:11px;color:var(--warn);padding:0 10px 8px}
.bcol.addcol{width:120px;border-style:dashed;background:transparent;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);min-height:200px;font-size:13px;text-align:center;padding:10px}
.bcol.addcol:hover{border-color:var(--accent);color:var(--ink)}

/* board: blue = pack settings, green = items */
.bc-s{background:var(--z-set);border-bottom-color:var(--z-set-line)}
.bc-zh{grid-column:1/-1;font:600 11px var(--f-display);letter-spacing:.05em;color:var(--z-set-ink)}
.bc-s .bc-f input{background:var(--panel)}
.bc-z{flex:1;display:flex;flex-direction:column;background:var(--z-itm)}
.bc-z>.bc-zh{color:var(--z-itm-ink);padding:8px 10px 0}
.bc-z .bi{background:var(--panel)}
.bc-z .bi.new{background:var(--accent-soft)}
.bc-z .bc-add>button{border-color:var(--z-itm-line);background:var(--panel)}
.bcol.over .bc-z{background:var(--accent-soft)}
/* board item library (left) */
#view-board{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start}
.blib{position:sticky;top:0;width:290px;max-height:100vh;display:flex;flex-direction:column;margin:12px 0 12px 16px;background:var(--panel);border:1px solid var(--z-itm-line);border-top:4px solid var(--z-itm-ink);border-radius:var(--r);overflow:hidden}
.blib-tg{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--z-itm);color:var(--z-itm-ink);padding:10px 12px;font:600 13px var(--f-display);letter-spacing:.04em;cursor:pointer;text-align:left}
.blib-tg .ar{margin-left:auto;transition:transform .15s}
.blib-body{display:flex;flex-direction:column;gap:6px;padding:8px;min-height:0;flex:1}
.blib-body .search{background:var(--panel-2)}
.blib-list{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 210px)}
.bl-it{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);cursor:grab;font-size:12px;line-height:1.25;user-select:none}
.bl-it:hover{border-color:var(--z-itm-ink)}
.bl-it.dragging{opacity:.45}
.bl-it .ico{width:32px;height:32px;font-size:9px;border-width:1px}
.bl-it small{display:block;font:10px var(--f-mono);color:var(--muted)}
.blib.closed{width:44px}
.blib.closed .blib-body{display:none}
.blib.closed .blib-tg{writing-mode:vertical-rl;padding:12px 0;align-items:center;justify-content:flex-start;min-height:180px}
.blib.closed .blib-tg .ar{margin:8px 0 0;transform:rotate(-90deg)}
@media (max-width:900px){#view-board{grid-template-columns:1fr}.blib{position:static;width:auto;margin:12px 16px 0}.blib.closed{width:auto}.blib.closed .blib-tg{writing-mode:horizontal-tb;min-height:0;padding:10px 12px}}

/* present view — mirrors the live web shop; always light, independent of the builder theme */
#view-present{min-height:calc(100% - 52px);background:#e9ecea}
.shop{--sh-bg:#e9ecea;--sh-card:#ffffff;--sh-line:#e2e5e3;--sh-ink:#2a2a2a;--sh-muted:#8b908d;--sh-soft:#f1f2f1;--sh-green:#10a77a;--sh-green-d:#0c8d66;
  --sh-dark:#332d2d;--sh-purple:#8a3fe0;--sh-purple-soft:#f5effd;--sh-orange:#ef8a1d;--sh-gold:#e6a514;
  --chip:#eef1ef;--muted:#7d837f;--panel-2:#f6f7f6;
  color-scheme:light;color:var(--sh-ink);font-family:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;max-width:1000px;margin:0 auto;padding:18px 16px 48px}
.sh-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.sh-top h1{margin:0;font:600 24px/1.2 "Kanit",var(--f-body);flex:1;min-width:200px;text-wrap:balance}
.sh-top .sub{font:400 13px "Kanit",var(--f-body);color:var(--sh-muted);display:block}
.sh-view{display:inline-flex;background:#fff;border:1px solid var(--sh-line);border-radius:999px;padding:3px}
.sh-view button{border:0;background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font:500 13px "Kanit",var(--f-body);color:var(--sh-muted)}
.sh-view button[aria-pressed="true"]{background:var(--sh-dark);color:#fff}
.sh-back{border:1px solid var(--sh-line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font:500 13px "Kanit",var(--f-body);color:var(--sh-ink)}
.sh-panel{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sh-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.sh-tab{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--sh-soft);border-radius:8px;padding:9px 16px;cursor:pointer;font:500 14px "Kanit",var(--f-body);color:var(--sh-ink)}
.sh-tab[aria-pressed="true"]{background:var(--sh-green);color:#fff}
.sh-tab .ci{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font:700 11px/1 var(--f-mono);color:#fff;background:#3b82f6}
.sh-tab .ce{font-size:14px;line-height:1}
.sh-tab .n{font:500 11px var(--f-mono);opacity:.7}
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px;padding-top:10px}
.sh-card{position:relative;background:#fff;border:1px solid var(--sh-line);border-radius:10px;padding:22px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center;transition:box-shadow .15s,transform .15s}
.sh-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-2px)}
.sh-card:focus-visible{outline:2px solid var(--sh-green);outline-offset:2px}
.sh-reset{position:absolute;top:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1.5px solid var(--sh-green);color:#3d5c50;border-radius:999px;padding:2px 12px;font:400 12px "Kanit",var(--f-body)}
.sh-badges{position:absolute;top:8px;left:-4px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;z-index:1}
.sh-bd{font:600 10.5px/1 "Kanit",var(--f-body);color:#fff;padding:3px 9px;border-radius:999px;background:var(--bc,#777);white-space:nowrap}
.sh-bd.rank{border-radius:4px 999px 999px 4px}
.sh-img{position:relative;width:120px;height:120px;display:grid;place-items:center;margin-top:6px}
.sh-img img{max-width:100%;max-height:100%;object-fit:contain}
.sh-img .ico{width:96px;height:96px;border-radius:14px;font-size:20px}
.sh-zoom{position:absolute;right:-4px;bottom:4px;width:28px;height:28px;border-radius:50%;background:rgba(80,80,80,.55);display:grid;place-items:center}
.sh-zoom svg{width:14px;height:14px;stroke:#fff}
.sh-gsp{display:inline-flex;align-items:center;gap:4px;font:400 13px "Kanit",var(--f-body);color:#444}
.leaf{display:inline-block;width:14px;height:12px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:linear-gradient(135deg,#ffd45c,#e2a10f);box-shadow:inset -2px 0 0 #c98a07}
.spi{display:inline-block;width:15px;height:12px;border-radius:50% 50% 45% 45%;background:linear-gradient(135deg,#c9b6f5,#9a7be0)}
.sh-name{font:600 16px/1.3 "Kanit",var(--f-body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-lim{width:100%;background:#f6f7f6;color:var(--sh-muted);border-radius:6px;padding:3px;font:400 13px "Kanit",var(--f-body)}
.sh-buy{width:100%;margin-top:8px;background:#f1f2f1;border-radius:8px;padding:10px;display:flex;align-items:center;gap:12px}
.sh-btn{background:var(--sh-green);color:#fff;border-radius:6px;padding:8px 16px;font:600 18px/1 "Kanit",var(--f-body)}
.sh-card:hover .sh-btn{background:var(--sh-green-d)}
.sh-price{display:inline-flex;align-items:baseline;gap:5px;font:600 19px/1 "Kanit",var(--f-body);font-variant-numeric:tabular-nums}
.sh-price small{font-size:11px;font-weight:600}
.sh-team{width:100%;margin-top:6px;border-radius:6px;padding:5px 8px;font:500 12px "Kanit",var(--f-body);display:flex;justify-content:space-between;gap:6px;background:#fff7e8;color:#8a5a00;border:1px dashed #f0c46a}
.sh-team.good{background:#eaf7f1;color:#0c7a55;border-color:#9fd9bf}
.sh-team.low{background:#fdeeee;color:#b23b3b;border-color:#f0b3b3}
.sh-empty{padding:40px 16px;text-align:center;color:var(--sh-muted);font-family:"Kanit",var(--f-body)}

/* detail modal */
.sh-ov{position:fixed;inset:0;z-index:25;background:rgba(40,40,40,.45);display:grid;place-items:center;padding:16px}
.sh-dlg{position:relative;width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:22px;padding:24px 28px;box-shadow:0 0 0 10px rgba(255,255,255,.35);color:var(--sh-ink);font-family:"Kanit",var(--f-body)}
.sh-x{position:absolute;top:14px;right:16px;border:0;background:none;font-size:26px;line-height:1;color:#777;cursor:pointer}
.sh-dlg h2{margin:0 0 14px;text-align:center;font:600 26px "Kanit",var(--f-body)}
.sh-hero{background:var(--sh-dark);color:#fff;border-radius:10px;padding:16px;display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 16px}
.sh-hero .pic{display:grid;place-items:center;grid-row:1/2}
.sh-hero .pic img{max-width:130px;max-height:120px;object-fit:contain}
.sh-hero .pic .ico{width:96px;height:96px;font-size:20px}
.sh-hero .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.sh-hero .idea{font-size:13px;line-height:1.5;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.12)}
.sh-hero .idea b{display:block;font-size:11.5px;opacity:.8;font-weight:600}
.sh-gsp.none{visibility:hidden}
.sh-hero .rs{font-size:12px;opacity:.85}
.sh-hero .nm{font:600 19px/1.3 "Kanit",var(--f-body);border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:6px}
.sh-hero .bds{display:flex;flex-wrap:wrap;gap:4px}
.sh-hero .bds .sh-bd{border-radius:999px}
.sh-hero .pr{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.15);margin-top:10px;padding-top:10px;display:flex;align-items:baseline;gap:6px;font:600 22px "Kanit",var(--f-body)}
.sh-hero .pr small{font-size:12px}
.sh-sec{margin:16px 0 6px;font:600 17px "Kanit",var(--f-body)}
.sh-sec.orange{color:var(--sh-orange)}
.sh-rows{display:flex;flex-direction:column;gap:6px}
.sh-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;background:#f2f3f2;border-radius:6px;padding:5px 14px;font-size:14px}
.sh-row.cond{grid-template-columns:minmax(0,1fr) auto;padding:6px 14px;color:#444}
.sh-row .ico{width:30px;height:30px;border-radius:6px;font-size:9px;border-width:1px}
.sh-row .q{font-variant-numeric:tabular-nums}
.sh-row .z svg{width:13px;height:13px;stroke:#e6a514}
.sh-rnd{background:var(--sh-purple-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sh-rnd .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-rnd .h b{color:var(--sh-purple);font:600 16px "Kanit",var(--f-body);min-width:0}
.sh-pick{background:var(--sh-purple);color:#fff;border-radius:999px;padding:3px 12px;font:600 13px "Kanit",var(--f-body);white-space:nowrap}
.sh-ri{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;background:#ece3fb;border-radius:8px;padding:8px 14px}
.sh-ri .ico{width:34px;height:34px;border-radius:6px;font-size:9px;border-width:1px;grid-column:1;grid-row:1/3}
.sh-ri .nm{font-size:14px;grid-column:2;grid-row:1}
.sh-ri .ch{grid-column:2;grid-row:2;justify-self:start;background:#e0cff9;color:var(--sh-purple);border-radius:999px;padding:1px 8px;font-size:12px}
.sh-ri .q{grid-column:3;grid-row:1/3}
.sh-ri .z{grid-column:4;grid-row:1/3}
.sh-ri .z svg{width:13px;height:13px;stroke:#e6a514}
/* collapsed: a white "see more" bar; expanded: the bar disappears and the rest of the items continue the same list */
.sh-more-list{display:flex;flex-direction:column;gap:8px}
.sh-more>summary{list-style:none;cursor:pointer;padding:8px 14px;display:flex;justify-content:space-between;font-size:14px;background:#fff;border:1px solid #d9cdee;border-radius:8px}
.sh-more>summary::-webkit-details-marker{display:none}
.sh-more>summary::after{content:"⌄";font-size:18px;line-height:.8}
.sh-more[open]>summary{display:none}
.bonus-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 8px var(--f-mono);color:#fff}
.bonus-ic.gsp{background:linear-gradient(135deg,#ffd45c,#e2a10f)}
.bonus-ic.exp{background:linear-gradient(135deg,#3fbf9a,#1b7f63)}
.sh-teamsec{margin-top:16px;border:1px dashed #f0c46a;background:#fffaf0;border-radius:10px;padding:12px 14px;font-size:14px}
.sh-teamsec h4{margin:0 0 8px;font:600 15px "Kanit",var(--f-body);color:#8a5a00}
.sh-kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.sh-kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.sh-haul{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.sh-haul div{display:flex;justify-content:space-between;gap:8px}
.sh-foot{display:flex;justify-content:center;gap:10px;margin-top:20px}
.sh-foot button{border:0;border-radius:6px;padding:12px 0;width:190px;max-width:45%;font:600 18px "Kanit",var(--f-body);cursor:pointer}
.sh-close{background:#c9c9c9;color:#fff}
.sh-order{background:var(--sh-green);color:#fff}

.modal{position:fixed;inset:0;z-index:20;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:16px}
.settings{width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.settings .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings hr{border:0;border-top:1px solid var(--line);margin:2px 0}
.tbtn.dirty{border-color:var(--accent);color:var(--accent)}
.status.err{color:#ffc9a8}
.settings h3{margin:0;font:600 15px var(--f-display)}
.settings p{margin:0;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30}

@media (max-width:1500px){ .app{grid-template-columns:minmax(260px,320px) minmax(0,1fr)} .work{grid-template-columns:1fr} .work .main{border-right:0} .aside{position:static;border-top:1px solid var(--line)} }
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .col.lib-col .scroll{max-height:46vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Hallmark · redesign (bespoke app screen) · genre: modern-minimal · structure: step rail + single-step workspace + live shop-card preview
 * pre-emit critique: P4 H5 E4 S5 R4 V4 · palette/fonts kept from the app so every view stays one system */
.b-app{display:grid;grid-template-columns:208px minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"packs packs packs" "rail main side";
  gap:0;padding:0;height:calc(100% - 52px)}
.b-packs{grid-area:packs;border-radius:0;border-bottom:1px solid var(--line);background:var(--panel)}
.b-rail{grid-area:rail;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px}
.b-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.b-steps li{position:relative}
.b-steps li + li::before{content:"";position:absolute;left:23px;top:-10px;height:20px;width:2px;background:var(--line)}
.b-step{display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:10px 8px;cursor:pointer;margin:6px 0}
.b-step:hover{background:var(--panel-2)}
.b-step[aria-current="step"]{background:var(--z-set);border-color:var(--z-set-line)}
.b-steps li:nth-child(1) .b-step[aria-current="step"]{background:var(--z-itm);border-color:var(--z-itm-line)}
.b-sn{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-display);border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.b-step[aria-current="step"] .b-sn{background:var(--z-set-ink);border-color:var(--z-set-ink);color:var(--panel)}

.sh-top h1{color:var(--pres-ink);text-shadow:0 1px 2px var(--pres-glow)}
.sh-top .sub{color:var(--pres-sub)}

<body>

<div class="top">
  <div class="brand">TOSM Pack Builder <small>live-ops</small></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-home" aria-selected="true">หน้าแรก</button>
    <button role="tab" id="tab-build" aria-selected="false">จัดแพ็ก</button>
    <button role="tab" id="tab-board" aria-selected="false">สรุปแพ็ก</button>
    <button role="tab" id="tab-present" aria-selected="false">นำเสนอ</button>
    <button role="tab" id="tab-items" aria-selected="false" title="ไอเทมที่วางขายและขายได้ ทุกโปรโมชัน">สรุปไอเทม</button>
  </div>
  <span class="crumb" id="crumb" hidden></span>
  <span class="status" id="status">กำลังโหลดไอเทม…</span>
  <button class="cloud" id="cloud" hidden title="ข้อมูลใช้ร่วมกันกับทุกคนที่เปิดลิงก์นี้"></button>
  <span class="spacer"></span>
  <button class="tbtn" id="btn-reload">↻ โหลดไอเทมใหม่</button>
  <button class="tbtn" id="btn-save" aria-haspopup="menu">บันทึกไฟล์</button>
  <button class="tbtn" id="btn-open">เปิดไฟล์</button>
  <button class="tbtn" id="btn-settings">ตั้งค่า</button>
  <input type="file" id="file-open" accept=".json,application/json" hidden>
  <input type="file" id="file-csv" accept=".csv,text/csv" hidden>
</div>

<div id="view-home"></div>
<div class="app b-app" id="view-build" hidden>
  <div class="packbar b-packs" id="packs" aria-label="แพ็กในโปรโมชัน"></div>
  <nav class="b-rail" id="b-rail" aria-label="ขั้นตอนจัดแพ็ก"></nav>
  <main class="b-main" id="b-main">
    <section class="b-lib lib-col" id="b-lib" aria-label="คลังไอเทม">
    <div class="colhead">
      <h2>คลังไอเทม</h2>
      <div class="views" role="group" aria-label="มุมมองคลังไอเทม">
        <button data-view="all" aria-pressed="true">ทั้งหมด</button>
        <button data-view="used" aria-pressed="false">ใช้บ่อย</button>
        <button data-view="pack" aria-pressed="false">ในแพ็กนี้</button>
      </div>
      <input class="search" id="q" type="search" placeholder="ค้นหาชื่อ (EN/TH) หรือ Item ID">
      <div class="filters">
        <select id="f-type" aria-label="ประเภทไอเทม"><option value="">ทุกประเภท</option></select>
        <select id="f-grade" aria-label="เกรด"><option value="">ทุกเกรด</option></select>
        <select id="f-trade" aria-label="ซื้อขายในตลาด"><option value="">ซื้อขาย: ทั้งหมด</option><option value="TRUE">ซื้อขายได้</option><option value="FALSE">ซื้อขายไม่ได้</option></select>
        <select id="f-class" aria-label="Item Class"><option value="">ทุก Class</option><option value="Character Item">Character (ต่อตัวละคร)</option><option value="Family Item">Family (ทั้งบัญชี)</option></select>
      </div>
      <div class="libcount" id="libcount"></div>
    </div>
    <div class="scroll"><div class="lib" id="lib"></div></div>
  </section>
    <div class="b-work"><div id="editor"></div><div id="sim"></div></div>
  </main>
  <aside class="b-side" id="summary" aria-label="ตัวอย่างและสรุปแพ็ก"></aside>
</div>

<div id="view-board" hidden>
  <aside class="blib" id="blib" aria-label="คลังไอเทม">
    <button class="blib-tg" id="blib-tg" aria-expanded="true" aria-controls="blib-body">🎁 คลังไอเทม <span class="ar">▾</span></button>
    <div class="blib-body" id="blib-body">
      <input class="search" id="blq" type="search" placeholder="ค้นหาชื่อ (EN/TH) หรือ Item ID" aria-label="ค้นหาไอเทม">
      <div class="filters"><select id="blf-type" aria-label="ประเภทไอเทม"><option value="">ทุกประเภท</option></select><select id="blf-grade" aria-label="เกรด"><option value="">ทุกเกรด</option></select></div>
      <div class="libcount" id="blcount"></div>
      <div class="blib-list" id="bllist"></div>
    </div>
  </aside>
  <div id="bd-main"></div>
</div>
<div id="view-present" hidden></div>
<div id="view-items" hidden></div>

<div class="modal" id="settings-modal" hidden>
<div class="settings" id="settings" role="dialog" aria-labelledby="s-title">
  <h3 id="s-title">ตั้งค่า</h3>
  <div class="fld" id="s-proj-wrap"><label for="s-proj">ชื่อโฟลเดอร์ที่เปิดอยู่ (หัวข้อหน้านำเสนอ)</label><input id="s-proj" placeholder="โปรโมชัน TOSM"></div>
  <div class="row2">
    <div class="fld"><label for="s-rate">อัตรา 1 TP = กี่ THB</label><input id="s-rate" type="number" min="0" step="0.01" placeholder="2"></div>
    <div class="fld"><label for="s-seed">Seed Point ต่อ 1 THB</label><input id="s-seed" type="number" min="0" step="1" placeholder="10"></div>
  </div>
  <div id="s-acct" hidden></div>
  <div class="fld" id="s-me-wrap" hidden><label for="s-me">ชื่อของคุณ (คนอื่นจะเห็นเมื่อคุณแก้ไข)</label><input id="s-me" maxlength="40" placeholder="เช่น SK"></div>
  <div id="s-api-wrap"><hr>
  <div class="fld"><label for="s-api">Apps Script URL (ลงท้ายด้วย /exec)</label><input id="s-api" placeholder="https://script.google.com/macros/s/…/exec"></div>

<script>
(() => {
"use strict";
const LS_STATE = "tosm-pack-builder:v1", LS_ITEMS = "tosm-pack-builder:items";
const DEFAULT_API = "https://script.google.com/macros/s/AKfycbxFC2r7OuZwK30-r8eoAOUOI8ieeCZScCWEqueJdrTVZ9P7rsvR_uP8m8vhVG2_oVlb/exec";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => { const x = parseFloat(String(v ?? "").replace(/,/g, "")); return isFinite(x) ? x : 0; };
const fmt = (v, d=2) => isFinite(v) ? v.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:d}) : "–";
const pct = v => isFinite(v) ? (v*100).toFixed(2) + "%" : "–";
const uid = () => Math.random().toString(36).slice(2, 9);
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let CLOUD = null;   // shared-data sync, set at boot when the page runs inside the Apps Script web app

/* ---------- state ---------- */
/* pack options */
const TYPES = ["NEW","STEP UP","EVENT","BEST SELLER","BEST HOT","RANK BRONZE","RANK SILVER","RANK GOLD","SALE","LIMITED","FLASHSALE","RECOMMEND","MILEAGE"];
const TYPE_LABEL = { "NEW":"New","STEP UP":"Step up","EVENT":"Event","BEST SELLER":"Best seller","BEST HOT":"Best hot","RANK BRONZE":"Rank bronze",
  "RANK SILVER":"Rank silver","RANK GOLD":"Rank gold","SALE":"Sale","LIMITED":"Limited","FLASHSALE":"Flashsale","RECOMMEND":"Recommend","MILEAGE":"Mileage" };
const DEFAULT_CATS = ["ซื้อทุกวัน","ซื้อทุกวีค","ซื้อทุกเดือน","มือใหม่","TP","แพ็ก & จุ่ม","บัฟ & อื่นๆ","GSP"];
const allCats = () => [...DEFAULT_CATS, ...(S.customCats || [])];
/* how each category is written in Aztek — must match character for character; editable in Settings */
/* exact text from Aztek (copied by SK, 14 Oct 2026) */
const AZ_DEFAULT = { "ซื้อทุกวัน":"Rank Shop - 1\uFE0F\u20E3 ซื้อทุกวัน", "ซื้อทุกวีค":"Rank Shop - 7\uFE0F\u20E3 ซื้อทุกวีค", "ซื้อทุกเดือน":"Rank Shop - \u{1F4C6} ซื้อทุกเดือน",
  "มือใหม่":"Rank Shop - \u{1F331} มือใหม่", "TP":"Rank Shop - \u{1F4B7} TP", "แพ็ก & จุ่ม":"Rank Shop - \u{1F4E6} แพ็ก & จุ่ม", "บัฟ & อื่นๆ":"Rank Shop - \u{1F96B}บัพ & อื่น ๆ", "GSP":"Rank Shop - \u{1FA99} GSP" };
const AZ_EXTRA = ["Rank Shop - \u{1F525} 8.8 เสว"];                     // other Aztek categories, pickable per pack
/* values shipped in the previous version that turned out wrong — upgraded automatically */
const AZ_OLD = { "ซื้อทุกเดือน":"Rank Shop - \u{1F5D3}\uFE0F ซื้อทุกเดือน", "TP":"Rank Shop - \u{1F3AB} TP", "บัฟ & อื่นๆ":"Rank Shop - \u{1F96B} บัฟ & อื่น ๆ" };
/* the Aztek category is the pack's only category now (it also names the shop tab and the board group) */
const azList = () => [...new Set([...DEFAULT_CATS.map(c => S.azMap[c]), ...AZ_EXTRA, ...(S.folders || []).flatMap(f => f.packs.map(p => String(p.azCat || "").trim()))].filter(Boolean))];
const catOf = p => String(p.azCat || "").trim() || S.azMap[p.category] || "";
const catLabel = c => c ? String(c).replace(/^Rank Shop\s*-\s*/, "") : "ยังไม่เลือกหมวด";
const catsInUse = packs => { const used = new Set(packs.map(catOf)); return [...azList(), ""].filter(c => used.has(c)); };
const azCatOf = p => String(p.azCat || "").trim() || S.azMap[p.category] || "";
const blankReset = (over={}) => ({ on:false, every:1, firstDate:"", firstTime:"23:59", ...over });
const blankPack = (over={}) => ({ id:uid(), name:"แพ็กใหม่", mode:"fixed", category:"แพ็ก & จุ่ม", types:[], image:"", start:"", startTime:"00:01",
  end:"", endTime:"23:59", reset:blankReset(), limit:1, price:0, pos:0, items:[], bonus:true, idea:"", azCat:(S?.azMap?.["แพ็ก & จุ่ม"] || ""), ...over });
function migratePack(p){
  if (!Array.isArray(p.types)) {
    const t = String(p.type || "").trim().toUpperCase().replace(/\s+/g," ");
    p.types = t && TYPES.includes(t) ? [t] : t === "HOT" ? ["BEST HOT"] : [];
  }
  delete p.type; delete p.rank;
  p.types = p.types.filter(t => TYPES.includes(t));
  if (!p.reset || typeof p.reset !== "object") {
    const old = String(p.reset || "");
    p.reset = !old || /no\s*reset/i.test(old) ? blankReset({ firstDate:p.start || "" })
      : blankReset({ on:true, every: /week/i.test(old) ? 7 : /month/i.test(old) ? 30 : 1, firstDate:p.start || "" });
  }
  p.reset = blankReset(p.reset);
  if (typeof p.image !== "string") p.image = "";
  if (p.pos === undefined || p.pos === null) p.pos = 0;
  p.items.forEach(x => { if (!x.uid) x.uid = uid(); });
  if (!p.category) p.category = "แพ็ก & จุ่ม";
  if (!String(p.azCat || "").trim() && S.azMap?.[p.category]) p.azCat = S.azMap[p.category];   // pin the Aztek category once
  if (p.bonus === undefined) p.bonus = true;            // gets Golden Seed Point + Player EXP
  if (typeof p.idea !== "string") p.idea = "";
  if (!allCats().includes(p.category)) S.customCats.push(p.category);
}
let S = null;
try { S = JSON.parse(lsGet(LS_STATE) || "null"); } catch { S = null; }
if (!S || (!Array.isArray(S.packs) && !Array.isArray(S.folders))) S = { packs:[] };
/* folders: each promotion set is a folder holding its own packs; S.packs always points at the open folder's packs */
const newFolder = (over={}) => ({ id:uid(), name:"โปรโมชันใหม่", created:Date.now(), updated:Date.now(), packs:[], ...over });
const curFolder = () => S.folders.find(f => f.id === S.folderId) || null;
function fixPacks(packs){
  packs.forEach(migratePack);
  packs.forEach(p => p.items.forEach(x => { if (x.itemId === "CUSTOM") { x.custom = true; x.itemId = ""; if (x.name === "ไอเทมใหม่") x.name = ""; } }));
}
function normalize(){
  S.memo = S.memo && typeof S.memo === "object" ? S.memo : {};
  S.usage = S.usage && typeof S.usage === "object" ? S.usage : {};
  const st = S.settings && typeof S.settings === "object" ? S.settings : {};
  S.settings = { rate: n(st.rate) > 0 ? n(st.rate) : 2, seed: n(st.seed) > 0 ? n(st.seed) : 10, api: String(st.api || DEFAULT_API), key: String(st.key || "") };
  S.customCats = Array.isArray(S.customCats) ? S.customCats.filter(c => c && !DEFAULT_CATS.includes(c)) : [];
  S.azMap = { ...AZ_DEFAULT, ...(S.azMap && typeof S.azMap === "object" ? S.azMap : {}) };
  Object.entries(AZ_OLD).forEach(([k, v]) => { if (S.azMap[k] === v) S.azMap[k] = AZ_DEFAULT[k]; });
  const oldVals = new Map(Object.entries(AZ_OLD).map(([k, v]) => [v, AZ_DEFAULT[k]]));
  (S.folders || []).forEach(f => f.packs.forEach(p => { if (oldVals.has(p.azCat)) p.azCat = oldVals.get(p.azCat); }));
  if (!Array.isArray(S.folders)) {           // older single-promotion data becomes the first folder
    S.folders = Array.isArray(S.packs) && S.packs.length ? [newFolder({ name:String(S.project || "").trim() || "โปรโมชัน TOSM", packs:S.packs, lastActive:S.activeId })] : [];
    S.folderId = S.folders[0]?.id || null;
  }
  S.folders.forEach(f => { f.packs = Array.isArray(f.packs) ? f.packs : []; f.name = String(f.name || "").trim() || "โปรโมชันไม่มีชื่อ"; fixPacks(f.packs); });
  const f = curFolder(); if (!f) S.folderId = null;
  S.packs = f ? f.packs : [];
  S.project = f ? f.name : "";
  if (f && !S.packs.length) { const p = blankPack({ name:"แพ็ก 1" }); S.packs.push(p); }
  if (f && !S.packs.some(p => p.id === S.activeId)) S.activeId = S.packs.some(p => p.id === f.lastActive) ? f.lastActive : S.packs[0].id;
}
normalize();
/* reset schedule: every reset moment inside the sale window, and how many purchase rounds that makes */
const toDT = (d, t) => { if (!d) return null; const x = new Date(`${d}T${t || "00:00"}`); return isNaN(x) ? null : x; };
const fmtDT = d => d.toLocaleDateString("th-TH", { day:"numeric", month:"short" }) + " " + d.toTimeString().slice(0,5);
function resetInfo(p){
  const rs = p.reset || {};
  if (!rs.on) return { on:false, times:[], periods:1 };
  const every = Math.max(1, Math.floor(n(rs.every)) || 1), first = toDT(rs.firstDate, rs.firstTime);
  const start = toDT(p.start, p.startTime), end = toDT(p.end, p.endTime);
  if (!first) return { on:true, every, times:[], periods:null, missing:true };
  const times = []; let t = new Date(first);
  for (let k = 0; k < 1000; k++) {
    if (end ? t >= end : times.length >= 5) break;
    if (!start || t > start) times.push(new Date(t));
    t.setDate(t.getDate() + every);
  }
  return { on:true, every, time:rs.firstTime || "00:00", times, periods: end ? times.length + 1 : null, noEnd: !end };
}
const resetLabel = p => { const ri = resetInfo(p); return ri.on ? `รีเซ็ตทุก ${ri.every} วัน · ${String(p.reset.firstTime || "00:00").replace(":", ".")} น.` : ""; };
const isCustom = x => !!x.custom;
const markDirty = () => { if (CLOUD) return; S.dirty = true; $("#btn-save")?.classList.add("dirty"); const b = $("#btn-save"); if (b) b.textContent = "บันทึกไฟล์ •"; };
const save = (dirty = true) => {
  const f = curFolder();
  if (f) { f.packs = S.packs; f.name = String(S.project || "").trim() || f.name; f.lastActive = S.activeId; if (dirty) f.updated = Date.now(); }
  if (dirty) markDirty();
  lsSet(LS_STATE, JSON.stringify({ ...S, packs:undefined }));
  CLOUD?.schedule();
};
const active = () => S.packs.find(p => p.id === S.activeId) || S.packs[0];

/* ---------- item library ---------- */
let ITEMS = [], BYID = new Map();
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<t.length;i++){ const c=t[i];
    if (q){ if (c==='"'){ if (t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true; else if (c===','){ row.push(f); f=""; }
    else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; } else if (c!=='\r') f+=c; }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
/* item frame colour by grade (SK's list, 17 Oct 2026); "(K/F/C)" grades use the same colour as the plain ones */
function gradeKey(g){
  const s = (g || "").trim().toLowerCase();
  if (s.includes("celestial")) return "cel";
  if (s.includes("goddess")) return "goddess";
  if (/^ur(\s|$|\()/.test(s)) return "ur";
  if (/^sr(\s|$|\()/.test(s)) return "sr";
  if (/^r(\s|$|\()/.test(s)) return "r";
  if (s.includes("legend")) return "legend";
  if (s.includes("epic")) return "epic";
  if (s.includes("unique")) return "unique";
  if (s.includes("rare")) return "rare";
  if (s.includes("trainee")) return "trainee";
  return "common";
}
const gradeColor = g => `var(--g-${gradeKey(g)})`;
/* raw rows: {row,id,en,th,img,type,cls,trade,grade,desc,az} — same shape from Apps Script and CSV */
/* web currencies have no game Item ID — they export by name as WALLET_DEBIT */
const CURRENCIES = [
  { id:"Gold_Cur",      name:"Gold",          exp:"Gold" },
  { id:"TP_Cur",        name:"TP",            exp:"TP" },
  { id:"Diamond_Cur",   name:"Diamond",       exp:"Diamond" },
  { id:"Popo_Kupo_1",   name:"Kupole Coin 1", exp:"Kupole Coin 1" },
  { id:"Popo_God_1",    name:"God Coin 1",    exp:"God Coin 1" },
  { id:"Popo_Fellow_1", name:"Fellow Coin 1", exp:"Fellow Coin 1" },
];
const CUR_BY = new Map(); CURRENCIES.forEach(c => { CUR_BY.set(c.id.toLowerCase(), c); CUR_BY.set(c.name.toLowerCase(), c); });
const currencyOf = x => CUR_BY.get(String(x.itemId || "").trim().toLowerCase()) || (isCustom(x) || !x.itemId ? CUR_BY.get(String(x.name || "").trim().toLowerCase()) : null) || null;
function setItems(raw){
  const out = raw.map(r => ({ key:r.id+"#"+r.row, id:String(r.id), name:r.en || r.th, th:r.th || "", img:r.img || "",
    type:r.type || "", cls:r.cls || "", trade:String(r.trade || "").toUpperCase(), grade:r.grade || "", desc:r.desc || "", az:r.az || "" }));
  CURRENCIES.forEach(c => { if (!out.some(i => i.id === c.id)) out.push({ key:c.id + "#cur", id:c.id, name:c.name, th:"", img:"", type:"Currency (Web)", cls:"Family Item", trade:"FALSE", grade:"", desc:"สกุลเงินบนเว็บ", az:"", currency:true }); });
  ITEMS = out; BYID = new Map(); out.forEach(it => { if (!BYID.has(it.id)) BYID.set(it.id, it); });
  lsSet(LS_ITEMS, JSON.stringify(raw));
  fillFilters(); renderLib(); renderEditor(); renderRight(); renderHome();
  return out.length;
}
function csvToRaw(text){
  const rows = parseCSV(text);
  const hi = rows.findIndex(r => r.some(c => c.trim() === "Item ID"));
  if (hi < 0) throw new Error("ไม่พบหัวคอลัมน์ Item ID ในไฟล์ CSV");
  const H = rows[hi].map(c => c.trim().replace(/\s+/g," "));
  const col = name => H.findIndex(h => h === name);
  const ci = { id:col("Item ID"), img:col("CDN URL"), th:col("Item TH"), en:col("Item EN"), type:col("Item Type"),
    cls:col("Item Class"), trade:col("Tradable"), grade:col("Grade"), desc:col("Description"), az:col("Aztek Item ID") };
  const g = (r,k) => ci[k] >= 0 ? (r[ci[k]] ?? "").trim() : "";
  const out = [];
  rows.forEach((r, i) => { if (i <= hi) return;
    const id = g(r,"id"); if (!id) return;
    const en = g(r,"en").replace(/\s+/g," "), th = g(r,"th").replace(/\s+/g," ");
    if (!en && !th) return;
    out.push({ row:i+1, id, en, th, img:g(r,"img"), type:g(r,"type"), cls:g(r,"cls"), trade:g(r,"trade"), grade:g(r,"grade"), desc:g(r,"desc"), az:g(r,"az") });
  });
  return out;
}
const hhmm = d => d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
async function fetchItems(){
  if (CLOUD?.call) { setStatus("กำลังโหลดไอเทมจาก Sheet…");
    try { const cnt = setItems(await CLOUD.call("api_items")); setStatus(`ไอเทม ${cnt.toLocaleString()} รายการ · อัปเดต ${hhmm(new Date())}`); }
    catch (e) { failLoad("โหลดไอเทมไม่ได้: " + (e?.message || e)); }
    return; }
  const api = S.settings.api.trim();
  if (!api) { setStatus(ITEMS.length ? `ไอเทม ${ITEMS.length.toLocaleString()} รายการ (ที่บันทึกไว้) · ยังไม่ได้ใส่ Apps Script URL` : "ยังไม่ได้ใส่ Apps Script URL · กด ตั้งค่า", true); return; }
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(api)) { setStatus("Apps Script URL ไม่ถูกต้อง · ต้องขึ้นต้นด้วย https://script.google.com/", true); return; }
  setStatus("กำลังโหลดไอเทมจาก Apps Script…");
  const url = api + (api.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(S.settings.key) + "&t=" + Date.now();
  let res, text;
  try { res = await fetch(url, { redirect:"follow" }); text = await res.text(); }
  catch { return failLoad("เชื่อมต่อ Apps Script ไม่ได้ · ตรวจว่า Deploy เป็น Web app, Who has access = Anyone และ URL ลงท้าย /exec"); }
  if (!res.ok) return failLoad(`Apps Script ตอบกลับ HTTP ${res.status} · ลอง Deploy เป็น New version อีกครั้ง`);
  let data; try { data = JSON.parse(text); }
  catch { return failLoad(/<html/i.test(text) ? "Apps Script ส่งหน้าเข้าสู่ระบบกลับมา · ตั้ง Who has access เป็น Anyone" : "ข้อมูลจาก Apps Script ไม่ใช่ JSON"); }
  if (!data.ok) return failLoad("Apps Script: " + (data.error || "เกิดข้อผิดพลาด"));
  const cnt = setItems(data.items || []);
  setStatus(`ไอเทม ${cnt.toLocaleString()} รายการ · อัปเดต ${hhmm(new Date())}`);
}
function failLoad(msg){ setStatus((ITEMS.length ? `ใช้รายการที่บันทึกไว้ (${ITEMS.length.toLocaleString()}) · ` : "") + msg, true); }
function setStatus(t, err=false){ const s = $("#status"); s.textContent = t; s.classList.toggle("err", err); s.title = t; }

function fillFilters(){
  const uniq = k => [...new Set(ITEMS.map(i => i[k]).filter(Boolean))].sort();
  const put = (sel, vals, first) => { const cur = sel.value; sel.innerHTML = `<option value="">${first}</option>` + vals.map(v => `<option>${esc(v)}</option>`).join(""); sel.value = vals.includes(cur) ? cur : ""; };
  put($("#f-type"), uniq("type"), "ทุกประเภท"); put($("#f-grade"), uniq("grade"), "ทุกเกรด");
  put($("#blf-type"), uniq("type"), "ทุกประเภท"); put($("#blf-grade"), uniq("grade"), "ทุกเกรด");
  renderBoardLib();
}
function icon(img, grade, name, cls="ico"){
  const ini = esc((name||"?").replace(/[^A-Za-z0-9ก-๙]/g,"").slice(0,2) || "?"), gk = gradeKey(grade);
  return `<span class="${cls}${gk === "ur" || gk === "cel" ? " gx-" + gk : ""}" style="--gc:${gradeColor(grade)}">${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}${img ? "" : ini}</span>`;
}
let libView = "all";
function packCounts(p = active()){
  if (!p) return new Map();
  const m = new Map(); p.items.forEach(x => { if (x.itemId) m.set(x.itemId, (m.get(x.itemId) || 0) + n(x.amt || 1)); }); return m;
}
function renderLib(){
  const q = $("#q").value.trim().toLowerCase(), ft=$("#f-type").value, fg=$("#f-grade").value, ftr=$("#f-trade").value, fc=$("#f-class").value;
  const inPack = packCounts(), usage = S.usage || {};
  let list = ITEMS.filter(i => (!q || i.name.toLowerCase().includes(q) || i.th.toLowerCase().includes(q) || i.id.toLowerCase().includes(q))
    && (!ft || i.type===ft) && (!fg || i.grade===fg) && (!ftr || i.trade===ftr) && (!fc || i.cls===fc));
  if (libView === "used") list = list.filter(i => usage[i.id]).sort((a,b) => usage[b.id] - usage[a.id]);
  if (libView === "pack") list = list.filter(i => inPack.has(i.id));
  // one card per Item ID in the "used"/"pack" views
  if (libView !== "all") { const seen = new Set(); list = list.filter(i => !seen.has(i.id) && seen.add(i.id)); }
  const filtered = q || ft || fg || ftr || fc;
  const emptyMsg = libView === "used" ? "ยังไม่มีไอเทมที่ใช้บ่อย · ไอเทมที่หยิบลงแพ็กจะมาอยู่ที่นี่"
    : libView === "pack" ? "แพ็กนี้ยังไม่มีไอเทมจากคลัง" : ITEMS.length ? "ไม่พบไอเทมที่ตรงกับคำค้นหรือตัวกรอง" : "ยังไม่มีรายการไอเทม";
